<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搶答拔河 · 小四數學科學</title>
<style>
:root{--sand:#F5D878;--ink:#24332E;--red:#E8413C;--blue:#2457E6;--paper:#FFFCEF;--ok:#287445;--grass:#88B963;--edge:.32vh solid var(--ink);--shadow:0 .45vh 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{height:100%}body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,input,select{outline-offset:.4vh}button:focus-visible,input:focus-visible,select:focus-visible{outline:.45vh solid #936121}button{border:var(--edge);background:var(--paper);min-height:6vh;font-weight:900}button:active:not(:disabled){translate:0 .3vh;box-shadow:0 .1vh 0 var(--ink)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}.screen.on{display:flex}
#start{align-items:center;justify-content:center;gap:2vh;text-align:center;padding:3vh 7vw;background:radial-gradient(circle at 8% 20%,#FFFCEF 0 1vh,transparent 1.1vh),radial-gradient(circle at 90% 68%,#FFFCEF 0 1.5vh,transparent 1.6vh),linear-gradient(165deg,#F8E5A9,var(--sand));isolation:isolate;overflow:hidden}
#start:before,#start:after{content:"";position:absolute;width:28vw;height:28vw;border:var(--edge);border-radius:50%;background:#A4C983;z-index:-1;bottom:-20vw;left:-5vw;box-shadow:0 -1vh 0 #FFFCEF}#start:after{left:auto;right:-5vw;background:#88B963}
.eyebrow{font-size:1.8vh;font-weight:900;letter-spacing:.35vw;background:var(--ink);color:var(--paper);padding:.65vh 2vw;border-radius:1vh;transform:rotate(-2deg)}
#start h1{font-size:10vh;line-height:1.1;font-weight:1000;letter-spacing:.4vw;color:var(--paper);-webkit-text-stroke:.55vh var(--ink);paint-order:stroke fill;text-shadow:.3vw .65vh 0 var(--ink);transform:rotate(-2deg)}#start h1 small{font-size:2.1vh;letter-spacing:.3vw;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-top:1.8vh;display:block}
.start-rule{font-size:2.2vh;font-weight:700}.teams{display:flex;align-items:center;gap:3vw;margin:1vh 0}.team-set{position:relative;padding:1vh 1vw 1.2vh;border:var(--edge);border-radius:2vh;box-shadow:var(--shadow);background:var(--paper);transform:rotate(-2deg)}.team-set.blue{transform:rotate(2deg)}.team-set:before{content:"左邊集合 · 紅隊";display:block;font-size:1.6vh;font-weight:900;text-align:left;margin-bottom:.6vh}.team-set.blue:before{content:"右邊集合 · 藍隊"}.team-set input{width:25vw;height:6.6vh;border:var(--edge);border-radius:1vh;text-align:center;font-size:3.7vh;font-weight:900;color:white;background:var(--red)}.team-set.blue input{background:var(--blue)}.vs{font-size:3.3vh;font-weight:1000;border:var(--edge);border-radius:50%;background:var(--paper);padding:1.8vh 1vw;transform:rotate(-9deg);box-shadow:var(--shadow)}
.opts{width:84vw;display:grid;grid-template-columns:repeat(6,1fr);gap:1.2vh 1vw;text-align:left}.opts label{grid-column:span 2;border:var(--edge);border-radius:1.5vh;background:var(--paper);padding:.8vh 1.2vw;box-shadow:0 .35vh 0 #B19A56;font-size:1.7vh;font-weight:900;min-width:0}.opts label:nth-child(n+4){grid-column:span 3}.opts select{display:block;width:100%;max-width:100%;height:6vh;padding:0 2vw 0 0;font-size:2.15vh;font-weight:800;border:0;appearance:none;background:linear-gradient(45deg,transparent 50%,var(--ink) 50%) calc(100% - .7vw) 50%/.65vw .65vw no-repeat,linear-gradient(135deg,var(--ink) 50%,transparent 50%) calc(100% - .05vw) 50%/.65vw .65vw no-repeat}
.big{font-size:3.5vh;padding:1.1vh 5vw;border-radius:2vh;background:var(--ink);color:var(--paper);box-shadow:0 .55vh 0 #728264;min-height:7vh}.big:after{content:" ↗";color:var(--sand)}.note{font-size:1.7vh;font-weight:700;min-height:2vh}.tiny{font-size:1.7vh;background:transparent;border:0;text-decoration:underline;padding:0 1vw;min-height:6vh}.start-admin{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.start-admin .note{font-size:1.6vh}
.arena{flex:0 0 28vh;position:relative;overflow:hidden;background:#BDE1E0;border-bottom:var(--edge)}.arena>svg{position:absolute;inset:0;width:100%;height:100%}.score{position:absolute;top:1.2vh;border:var(--edge);border-radius:1.4vh;background:var(--red);color:white;font-size:2.5vh;font-weight:900;padding:.65vh 1.5vw;box-shadow:var(--shadow);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score.l{left:2vw;rotate:-2deg}.score.r{right:2vw;background:var(--blue);rotate:2deg}.score:before{content:"⚑ ";color:var(--sand)}
.callout{position:absolute;left:50%;top:50%;max-width:84vw;width:max-content;transform:translate(-50%,-50%) scale(0) rotate(-5deg);font-size:5.3vh;font-weight:1000;line-height:1.2;padding:1.4vh 2.3vw;background:var(--paper);border:.5vh solid var(--ink);border-radius:2vh;box-shadow:.5vw .8vh 0 var(--ink);text-align:center;pointer-events:none;transition:transform .25s cubic-bezier(.2,1.5,.5,1)}.callout.show{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.1vh 2vw 1vh;gap:1vh;background:var(--paper)}.meta{display:flex;align-items:center;justify-content:space-between;gap:1vw;font-size:1.8vh;font-weight:900;min-height:3.3vh}.meta>div:first-child{display:flex;gap:.65vw}.tag{display:inline-block;white-space:nowrap;padding:.4vh .85vw;border: .23vh solid var(--ink);border-radius:.8vh;background:#F5E4AC}#domTag{background:#DCEBD0}#typeTag{background:var(--ink);color:var(--paper)}.timer{position:relative;width:14vw;flex-shrink:0;height:2.6vh;background:#E6DDC6;border:var(--edge);border-radius:2vh;overflow:hidden}.timer i{display:block;width:100%;height:100%;background:#6DAB59;transition:width 1s linear}.timer:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 2.4vw,#FFFCEF 2.4vw 2.55vw)}.timer i.low{background:var(--red);animation:urgent .55s steps(2) infinite}
.q{font-size:3.05vh;line-height:1.35;font-weight:900;padding:1.15vh 1.5vw 1.15vh 2.1vw;border:var(--edge);border-radius:1.4vh;background:white;box-shadow:0 .4vh 0 #D7CEB7;white-space:pre-line;max-height:12vh;min-height:6.6vh;overflow:auto;border-left:1vw solid var(--sand);flex-shrink:0}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vw;flex:1;min-height:0}.side{--team:var(--red);display:flex;flex-direction:column;gap:.7vh;min-height:0;padding:.8vh .8vw;border:var(--edge);border-radius:1.6vh;background:#FAE5DB;position:relative}.side.s1{--team:var(--blue);background:#E2EAF8}.head{display:flex;align-items:center;justify-content:space-between;gap:1vw;min-height:3.3vh;font-size:2vh;font-weight:900;color:var(--team);padding:0 .3vw}.head:after{content:"準備作答";font-size:1.5vh;border:.2vh solid currentColor;border-radius:1vh;padding:.2vh .7vw}.side.done .head:after{content:"✓ 已交卷";background:var(--team);color:white;border-color:var(--team)}.side.done{border-color:var(--team)}.side.locked button{pointer-events:none}.body{flex:1;min-height:0;overflow:auto;padding:.2vh .15vw .6vh;scrollbar-width:thin}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1vh .8vw}.col{display:flex;flex-direction:column;gap:.7vh}.opt{position:relative;display:flex;align-items:center;gap:.8vw;min-height:6vh;flex-shrink:0;padding:.65vh .9vw;border-radius:1.2vh;background:var(--paper);box-shadow:0 .35vh 0 var(--ink);font-size:2.8vh;text-align:left;line-height:1.2;transition:background .15s,transform .15s;overflow-wrap:anywhere}.opt b{display:grid;place-items:center;width:3.7vh;height:3.7vh;flex-shrink:0;background:var(--team);color:white;font-size:2.1vh;border-radius:.8vh;border:.2vh solid var(--ink)}.opt span{flex:1}.grid2 .opt{font-size:3.1vh}.grid2 .opt b{align-self:flex-start}.opt.picked{background:var(--sand);box-shadow:0 .15vh 0 var(--ink);transform:translateY(.2vh)}.opt.picked:after{content:"●";font-size:2vh}.opt.right,.np-display.right{background:#D8EDBC;border-color:var(--ok);box-shadow:0 .35vh 0 var(--ok)}.opt.right:after{content:"✓";color:var(--ok);font-size:3vh}.opt.wrong,.np-display.wrong{background:#F8C9BE;border-color:#A42A26;box-shadow:0 .35vh 0 #A42A26}.opt.wrong:after{content:"×";color:#A42A26;font-size:3vh}.opt.dim{background:#EAE7DE;color:#777B73;border-color:#A2A79C;box-shadow:0 .25vh 0 #A2A79C}.opt.dim b{background:#777B73}.confirm{border-radius:1.2vh;min-height:6vh;padding:.5vh 3vw;font-size:2.6vh;background:var(--team);color:white;box-shadow:0 .35vh 0 var(--ink);flex-shrink:0;width:100%;margin-top:auto}.confirm:disabled{background:#D0D2C9;color:#646B61;border-color:#889080;box-shadow:0 .25vh 0 #889080}.np-display{font-size:3.2vh;line-height:1.1;min-height:6vh;border:var(--edge);border-radius:1vh;background:#FFFCEF;box-shadow:inset 0 .4vh 0 #E1DBC5;text-align:right;padding:.9vh 1vw;font-weight:900;font-variant-numeric:tabular-nums;flex-shrink:0}.np-display small{font-size:2vh;margin-left:1vw}.np-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65vh .7vw;flex-shrink:0}.np-keys button{min-height:6vh;border-radius:1vh;background:#FFFCEF;box-shadow:0 .3vh 0 var(--ink);font-size:2.9vh}.np-keys button:nth-child(4n){background:#F1DDA4}.ord{display:flex;flex-direction:column;gap:.8vh}.ord .opt:before{content:"⠿";color:#788172;font-size:2.5vh}.ord .opt.sel{background:var(--sand);outline:.3vh dashed var(--ink);outline-offset:-.8vh}.ord .opt{padding-right:1.5vw}.body.col:has(.ord):before{content:"拖動卡片排次序，或點兩張交換";font-size:1.7vh;font-weight:700;flex-shrink:0}.body.col>div:last-child:not(.np-keys):not(.np-display):not(.ord){flex-shrink:0}
.foot{display:flex;gap:1vw;align-items:center;min-height:6vh;padding-right:8vw;flex-shrink:0}.why{opacity:0;flex:1;font-size:2vh;font-weight:700;line-height:1.3;max-height:6vh;overflow:auto}.why.show{opacity:1}.next{visibility:hidden;min-height:6vh;flex-shrink:0;border-radius:1.2vh;background:var(--ink);color:var(--paper);padding:.6vh 2vw;font-size:2.5vh;box-shadow:0 .3vh 0 #71816A}.next.show{visibility:visible}.fs{position:absolute;right:2vw;bottom:1vh;font-size:1.7vh;border-radius:1vh;padding:.5vh .8vw;min-height:6vh;background:#EEE9DB}
#win{align-items:center;justify-content:center;text-align:center;gap:2vh;padding:3vh;isolation:isolate;overflow:hidden;color:var(--paper)}#win.red{background:#C93631}#win.blue{background:#204BC3}#win.draw{background:#38584B}#win:before{content:"";position:absolute;inset:-40vh -30vw;background:repeating-conic-gradient(from 0deg,transparent 0deg 20deg,#FFFCEF0D 20deg 40deg);z-index:-1;animation:sunburst 80s linear infinite}#win:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 7vw,#F5D878 7vw 8vw,transparent 8vw 13vw,#FFFCEF 13vw 13.5vw,transparent 13.5vw 20vw) top/100% 2vh no-repeat;animation:ribbons 2s ease-in-out infinite alternate}#win h2{font-size:7.5vh;line-height:1.15;max-width:88vw;-webkit-text-stroke:.5vh var(--ink);paint-order:stroke fill;text-shadow:0 .65vh 0 var(--ink)}#win p{font-size:2.8vh;font-weight:800}#win .miss{font-size:2.2vh;line-height:1.5;max-width:80vw;max-height:15vh;overflow:auto;background:var(--paper);color:var(--ink);border:var(--edge);border-radius:1.6vh;padding:1.2vh 2vw;box-shadow:var(--shadow)}#win .big{background:var(--sand);color:var(--ink)}#win .big:after{color:var(--ink)}.trophy{width:17vw;height:22vh;overflow:visible;filter:drop-shadow(0 .6vh 0 #24332E);animation:trophy 2.4s ease-in-out infinite}.victory-kids{position:absolute;bottom:2vh;width:20vw;height:25vh;overflow:visible;z-index:-1}.victory-kids.red-kids{left:1vw}.victory-kids.blue-kids{right:1vw}#win.red .red-kids,#win.blue .blue-kids{animation:cheer .7s ease-in-out infinite alternate}#win.red .blue-kids,#win.blue .red-kids{transform:translateY(7vh) rotate(12deg);opacity:.8}
.kid-motion{transform-box:fill-box;transform-origin:60% 100%;animation:ready 2.4s ease-in-out infinite}.kid-1 .kid-motion{animation-delay:-.6s}.kid-2 .kid-motion{animation-delay:-1.2s}.kid-3 .kid-motion{animation-delay:-1.8s}.dust{opacity:0}#game[data-result="0"] #teamL .kid-motion,#game[data-result="1"] #teamR .kid-motion{animation:heave .7s ease-in-out 2}#game[data-result="1"] #teamL .kid-motion,#game[data-result="0"] #teamR .kid-motion{animation:stumble .65s ease-in-out 2}#game[data-result="none"] .rope-texture,#game[data-result="timeout"] .rope-texture{animation:shake .16s ease-in-out 6}#game[data-result="none"] .dust,#game[data-result="timeout"] .dust{animation:dust 1.2s ease-out}#game[data-result="0"] .score.l,#game[data-result="1"] .score.r{animation:cheer .35s ease-in-out 4}
@keyframes ready{50%{transform:rotate(-1deg)}}@keyframes heave{40%{transform:rotate(-9deg)}75%{transform:rotate(-4deg)}}@keyframes stumble{35%{transform:rotate(9deg)}65%{transform:rotate(-3deg)}}@keyframes shake{50%{transform:translateY(.4vh)}}@keyframes dust{20%{opacity:.8}100%{opacity:0;transform:translateY(-1vh)}}@keyframes urgent{50%{filter:brightness(1.5)}}@keyframes cheer{to{translate:0 -1.5vh;rotate:-3deg}}@keyframes trophy{50%{transform:rotate(4deg)}}@keyframes sunburst{to{transform:rotate(360deg)}}@keyframes ribbons{to{transform:translateY(1vh)}}
.seated{display:none}#win.red .blue-kids .standing,#win.blue .red-kids .standing{display:none}#win.red .blue-kids .seated,#win.blue .red-kids .seated{display:inline}#win.red .blue-kids,#win.blue .red-kids{transform:none;opacity:1}
@media(max-aspect-ratio:3/2){.arena{flex-basis:24vh}.panel{gap:.8vh}.meta{font-size:1.55vh;gap:.5vw}.tag{padding:.4vh .6vw}.timer{width:12vw}.q{font-size:2.8vh}.opts{width:90vw}.opts select{font-size:2vh}.team-set input{width:29vw}.grid2 .opt{font-size:2.7vh}.score{font-size:2.2vh}.victory-kids{width:17vw}.start-admin .note{flex-basis:100%}#start{gap:1.5vh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== 白板實測後的調整（2026-09-11）：字級加大、題目欄撐滿、拖拉排序、靜音鍵 ===== */
.panel{padding:1vh 1.6vw 1vh}
.meta{font-size:2.3vh}.meta .tag{font-size:2.2vh}
.q{font-size:4.4vh;line-height:1.3;max-height:19vh;min-height:8.5vh;padding:1.4vh 2vw 1.4vh 2.4vw;width:100%}
.opt{font-size:4.1vh;min-height:8vh;gap:1.4vw}.opt b{width:5.2vh;height:5.2vh;font-size:3vh;border-radius:1.1vh}
.grid2 .opt{font-size:4.6vh;min-height:9vh}
.col .opt,.ord .opt{font-size:3.9vh;min-height:6.8vh}
.np-display{font-size:5vh;min-height:7vh}.np-keys button{font-size:4.2vh;min-height:6.2vh}
.confirm{font-size:3.4vh}
.why{font-size:2.7vh;max-height:8vh}
.ord .opt{touch-action:none;transition:transform .12s;position:relative}
.ord .opt.dragging{transition:none;z-index:5;box-shadow:0 1.2vh 1.6vh rgba(0,0,0,.25);background:#FFF3B0}
#muteBtn{right:auto;left:2vw}
@media (prefers-reduced-motion:reduce){.ord .opt{transition:none}}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="eyebrow">午休運動會 · 一起動腦，一起出力</div><h1>搶答拔河<small>小四數學 × 科學挑戰</small></h1><p class="start-rule">兩隊同時作答 · 答對向自己拉 · 繩結過線就獲勝</p>
  <div class="teams">
    <div class="team-set red"><input aria-label="紅隊名稱" id="nameL" value="紅隊" maxlength="8"></div>
    <div class="vs">VS</div>
    <div class="team-set blue"><input aria-label="藍隊名稱" id="nameR" value="藍隊" maxlength="8"></div>
  </div>
  <div class="opts">
    <label>科目<select id="subject"><option value="混合" selected>數學＋科學</option><option value="數學">數學</option><option value="科學">科學</option></select></label>
    <label>拉過幾格獲勝<select id="winAt"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option></select></label>
    <label>題數<select id="nq"><option>6</option><option>8</option><option selected>10</option><option>12</option><option>15</option></select></label>
    <label>時限<select id="tlimit"><option value="1" selected>預設（選擇 30 秒、輸入排序 45 秒）</option><option value="0">不限時</option><option value="0.67">短（20／30 秒）</option><option value="1.5">長（45／68 秒）</option></select></label>
    <label>範圍<select id="scope"><option value="taught" selected>跟進度（七成已教、三成全範圍）</option><option value="all">全範圍</option></select></label>
  </div>
  <button class="big" id="startBtn">開始拔河</button>
  <div class="note" id="startNote"></div>
  <div class="start-admin">
    <span class="note" id="bankinfo"></span>
    &nbsp;·&nbsp;<button class="tiny" id="exportBtn">匯出紀錄 CSV</button>
    &nbsp;·&nbsp;<button class="tiny" id="clearBtn">清除紀錄</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="arena">
    <svg viewBox="0 0 1600 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <pattern id="ropeTwist" width="24" height="18" patternUnits="userSpaceOnUse"><rect width="24" height="18" fill="#F5D878"/><path d="M-8 18L4 0M4 18L16 0M16 18L28 0" stroke="#98703F" stroke-width="5"/></pattern>
        <pattern id="crowd" width="84" height="42" patternUnits="userSpaceOnUse"><path d="M8 40v-8q9-12 18 0v8" fill="#E8413C"/><circle cx="17" cy="19" r="8" fill="#24332E"/><path d="M49 40v-8q9-12 18 0v8" fill="#2457E6"/><circle cx="58" cy="19" r="8" fill="#98703F"/></pattern>
      </defs>
      <rect width="1600" height="320" fill="#BDE1E0"/>
      <g stroke="#24332E" stroke-width="5" stroke-linejoin="round">
      <circle cx="1290" cy="54" r="32" fill="#F5D878"/>
      <path d="M190 65q-12-27 14-31 9-37 40-17 31-7 32 25 25 0 20 23Z M970 49q-7-24 18-25 10-30 35-12 30-5 29 22 22 0 18 15Z" fill="#FFFCEF"/>
      <path d="M0 165Q150 34 330 150Q460 60 620 157Q800 62 990 153Q1180 57 1370 150Q1500 90 1600 154V230H0Z" fill="#9DBE94"/>
      <path d="M260 153v-40h1080v40" fill="#F5D878"/><path d="M285 112v-35h1030v35" fill="#FFFCEF"/>
      <path d="M290 111V79h1018v32" fill="url(#crowd)" stroke="none"/>
      <path d="M80 64Q800 137 1520 64" fill="none"/>
      <path d="M180 74l36 3-22 28Z M470 96l36 2-20 29Z M1070 96l36-2-16 29Z M1360 77l36-3-14 30Z" fill="#E8413C"/>
      <path d="M325 87l36 3-22 27Z M615 103l36 1-20 28Z M925 103l36-1-16 30Z M1215 87l36-3-14 30Z" fill="#2457E6"/>
      <path d="M0 162H1600V320H0Z" fill="#88B963"/>
      <path d="M0 227Q800 210 1600 227V304H0Z" fill="#DEAE73"/>
      </g>
      <path d="M0 243Q800 226 1600 243M0 294H1600" fill="none" stroke="#FFFCEF" stroke-width="5"/>
      <path d="M280 243h250v48H280Z" fill="#E8413C" opacity=".25"/><path d="M1070 243h250v48h-250Z" fill="#2457E6" opacity=".25"/>
      <path d="M110 309l-6-10m6 10 9-9M680 313l-6-10m6 10 9-9M1450 313l-6-10m6 10 9-9" stroke="#426544" stroke-width="4" fill="none"/>
      <line id="goalL" x1="500" y1="221" x2="500" y2="313" stroke="#B72E2A" stroke-width="10" stroke-dasharray="14 8"/>
      <line id="goalR" x1="1100" y1="221" x2="1100" y2="313" stroke="#183FA8" stroke-width="10" stroke-dasharray="14 8"/>
      <path d="M800 255v60" stroke="#FFFCEF" stroke-width="7"/>
      <g stroke="#24332E" stroke-width="5" stroke-linejoin="round"><path d="M800 293v-60h44l-12 13 12 13h-44" fill="#F5D878"/><ellipse cx="800" cy="298" rx="12" ry="4" fill="#24332E"/></g>
      <g id="teamL"></g><g id="teamR"></g>

<script>
const TUG_BANK = [{"id": "G-M-2026-09-001", "subject": "數學", "topic": "數01", "level": "推理", "type": "order", "stem": "把這四個數由小到大排好：", "options": ["5 078", "5 780", "5 087", "5 708"], "answer": [0, 2, 3, 1], "explain": "千位都是 5，先比百位：0 比 7 小；再比十位。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-002", "subject": "數學", "topic": "數03", "level": "應用", "type": "numpad", "stem": "一箱橙有 24 個。學校買了 18 箱，開學禮發給學生後剩下 37 個。一共發出了多少個？", "answer": 395, "unit": "個", "explain": "24 × 18 = 432，432 − 37 = 395。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-003", "subject": "數學", "topic": "數05", "level": "推理", "type": "multi", "stem": "下面哪些數既是 3 的倍數，又是 4 的倍數？", "options": ["18", "24", "30", "36", "44"], "answer": [1, 3], "explain": "要同時是 3 和 4 的倍數，就是 12 的倍數：24 和 36。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-004", "subject": "數學", "topic": "數09", "level": "知道", "type": "mcq", "stem": "哪個分數比 1/2 大？", "options": ["2/5", "3/8", "4/7", "5/12"], "answer": 2, "explain": "4/7 中，分子 4 比分母的一半 3.5 大，所以超過一半。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-005", "subject": "數學", "topic": "數01", "level": "知道", "type": "mcq", "stem": "「四千零九」用數字寫是哪一個？", "options": ["4 009", "4 090", "4 900", "40 009"], "answer": 0, "explain": "千位是 4，百位和十位都沒有，中間要補兩個 0。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-006", "subject": "數學", "topic": "數01", "level": "應用", "type": "mcq", "stem": "四個場館的人數：甲 2 405、乙 2 450、丙 2 045、丁 2 504。\n人數第二多的是哪個場館？", "options": ["甲", "乙", "丙", "丁"], "answer": 1, "explain": "四個數的千位都是 2，要逐位往下比才分得出先後。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-007", "subject": "數學", "topic": "數01", "level": "應用", "type": "numpad", "stem": "把 4 736 的百位數字 7 改成 2，這個數減少了多少？", "answer": 500, "explain": "百位少了 5，即少了 5 個一百。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-008", "subject": "數學", "topic": "數02", "level": "應用", "type": "mcq", "stem": "球賽首天售出 1 860 張門票，次天比首天少 245 張。\n兩天共售出多少張？", "options": ["1 615", "2 105", "3 475", "3 720"], "answer": 2, "explain": "「少 245 張」要先求出次天的張數，再把兩天相加。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-009", "subject": "數學", "topic": "數02", "level": "推理", "type": "multi", "stem": "下面哪些算式的答案大於 5 000？", "options": ["2 480＋2 530", "4 900＋150", "6 200－1 300", "3 000＋1 900", "5 600－400"], "answer": [0, 1, 4], "explain": "把數湊成整千來估：只有這三題超過 5 000，不必準確計算。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-010", "subject": "數學", "topic": "數03", "level": "知道", "type": "mcq", "stem": "計算 32 × 24。", "options": ["128", "192", "608", "768"], "answer": 3, "explain": "32 × 20 ＝ 640，32 × 4 ＝ 128，兩個部分積要相加。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-011", "subject": "數學", "topic": "數03", "level": "應用", "type": "mcq", "stem": "一幅牆每行貼 14 塊瓷磚，貼了 25 行。\n牆上共有多少塊瓷磚？", "options": ["39", "280", "350", "364"], "answer": 2, "explain": "整齊排成行列的東西，用每行的數目乘行數。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-012", "subject": "數學", "topic": "數03", "level": "推理", "type": "multi", "stem": "下面哪些算式的積和 24 × 16 相等？", "options": ["12×32", "48×8", "6×64", "16×25", "24×8＋24×8"], "answer": [0, 1, 2, 4], "explain": "一邊加倍、另一邊減半，積不變；拆成兩份再相加也不變。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-013", "subject": "數學", "topic": "數04", "level": "知道", "type": "mcq", "stem": "計算 728 ÷ 7。", "options": ["14", "104", "107", "140"], "answer": 1, "explain": "十位的 2 不夠 7 除，商的十位要寫 0，不可以留空。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-014", "subject": "數學", "topic": "數04", "level": "應用", "type": "numpad", "stem": "有 227 顆珠子，每 6 顆串成一條手鏈。\n串完後餘下多少顆？", "answer": 5, "unit": "顆", "explain": "6 × 37 ＝ 222，剩下的不夠再串一條。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-015", "subject": "數學", "topic": "數04", "level": "應用", "type": "mcq", "stem": "餐廳有 174 隻雞蛋，用去 54 隻，其餘每 6 隻裝一盒。\n可裝滿多少盒？", "options": ["9", "20", "24", "29"], "answer": 1, "explain": "要先減去用去的，才可以用剩下的去除。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-016", "subject": "數學", "topic": "數04", "level": "推理", "type": "order", "stem": "把下面各題的商由小到大排好：", "options": ["720 ÷ 5", "720 ÷ 8", "720 ÷ 4", "720 ÷ 6"], "answer": [1, 3, 0, 2], "explain": "被除數相同，分的份數越多，每份就越少。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-017", "subject": "數學", "topic": "數05", "level": "應用", "type": "multi", "stem": "下面哪些數是 40 的因數？", "options": ["3", "5", "8", "12", "20"], "answer": [1, 2, 4], "explain": "因數要能把 40 整除，除下來沒有餘數。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-018", "subject": "數學", "topic": "數05", "level": "推理", "type": "mcq", "stem": "任意兩個奇數相加，和一定是甚麼數？", "options": ["奇數", "偶數", "有時奇有時偶", "5 的倍數"], "answer": 1, "explain": "每個奇數都比偶數多 1，兩個多出來的 1 剛好合成一對。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-019", "subject": "數學", "topic": "數06", "level": "知道", "type": "mcq", "stem": "3 962 取近似值至百位是多少？", "options": ["3 900", "3 960", "4 000", "4 900"], "answer": 2, "explain": "取至百位就看十位：6 夠 5 要進位，後面寫 0。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-020", "subject": "數學", "topic": "數06", "level": "應用", "type": "numpad", "stem": "劇院有 38 行座位，每行 52 個。\n估計全院約有多少個座位？", "answer": 2000, "unit": "個", "tolerance": 150, "explain": "把 38 看成 40、52 看成 50，估算只求接近，不求準確。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-021", "subject": "數學", "topic": "數07", "level": "應用", "type": "numpad", "stem": "□ × 7 ＋ 15 ＝ 71，□ 是多少？", "answer": 8, "explain": "倒着做：先減去後加的 15，再除以 7。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-022", "subject": "數學", "topic": "數07", "level": "推理", "type": "mcq", "stem": "24 □ 6 □ 3 ＝ 7\n兩個 □ 依次應填甚麼符號？", "options": ["÷ ＋", "× －", "－ ÷", "÷ ×"], "answer": 0, "explain": "24 ÷ 6 ＝ 4，離 7 還差 3，所以第二個要填加號。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-023", "subject": "數學", "topic": "數08", "level": "應用", "type": "order", "stem": "這個數列每次減 12，把四個數排回原來次序：", "options": ["31", "67", "43", "55"], "answer": [1, 3, 2, 0], "explain": "每次減 12，所以最大的排最前，之後逐個減 12。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-024", "subject": "數學", "topic": "數08", "level": "推理", "type": "order", "stem": "下面四個數列的第 5 個數，由小到大排：", "options": ["2、4、6、8、…", "1、3、9、27、…", "6、12、18、24、…", "5、10、15、20、…"], "answer": [0, 3, 2, 1], "explain": "先找出每列的規律，再數到第 5 個：10、81、30、25。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-025", "subject": "數學", "topic": "數08", "level": "推理", "type": "numpad", "stem": "數列：3、7、15、31、□。\n□ 是多少？", "answer": 63, "explain": "相鄰兩數的差是 4、8、16，每次加倍，下一次要加 32。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-026", "subject": "數學", "topic": "數09", "level": "推理", "type": "order", "stem": "把這四個分數由大到小排好：", "options": ["1/3", "3/4", "1/2", "5/6"], "answer": [3, 1, 2, 0], "explain": "全部化成十二分之幾：10/12、9/12、6/12、4/12。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-027", "subject": "數學", "topic": "數10", "level": "知道", "type": "mcq", "stem": "計算 5/9 － 2/9。", "options": ["2/9", "3/9", "3/18", "7/9"], "answer": 1, "explain": "分母 9 是「分成 9 份」，份數不變，只減分子。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-028", "subject": "數學", "topic": "數10", "level": "應用", "type": "numpad", "stem": "一個蛋糕平均分成 12 份。哥哥吃了 3/12，妹妹吃了 5/12。\n還剩多少份？", "answer": 4, "unit": "份", "explain": "3/12 和 5/12 合起來是 8 份，用 12 減去。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-029", "subject": "數學", "topic": "數10", "level": "推理", "type": "multi", "stem": "下面哪些算式的答案剛好等於 1？", "options": ["3/5＋2/5", "4/9＋5/9", "2/6＋3/6", "7/10＋3/10", "5/8＋4/8"], "answer": [0, 1, 3], "explain": "分子加起來剛好等於分母，就是一個完整的整體。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-030", "subject": "數學", "topic": "數11", "level": "知道", "type": "mcq", "stem": "0.45 中的 4 表示多少？", "options": ["4 個一", "4 個十分之一", "4 個百分之一", "4 個十"], "answer": 1, "explain": "小數點後第一位是十分位，4 正好站在那一位。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-031", "subject": "數學", "topic": "數11", "level": "應用", "type": "order", "stem": "把這四個小數由大到小排好：", "options": ["0.4", "0.35", "0.5", "0.45"], "answer": [2, 3, 0, 1], "explain": "先比十分位，十分位相同才比百分位，不是看寫得長就大。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-032", "subject": "數學", "topic": "數12", "level": "應用", "type": "order", "stem": "把下面各題的答案由小到大排好：", "options": ["1.5 ＋ 0.25", "2 － 0.4", "0.95 ＋ 0.7", "2.1 － 0.4"], "answer": [1, 2, 3, 0], "explain": "四個答案是 1.75、1.6、1.65、1.7，比較時先看十分位。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-033", "subject": "數學", "topic": "數12", "level": "應用", "type": "mcq", "stem": "一袋米重 2.35 公斤，一袋麵粉比它重 0.4 公斤。\n麵粉重多少公斤？", "options": ["1.95", "2.39", "2.75", "6.35"], "answer": 2, "explain": "「比它重」要用加法，而且 0.4 的 4 要對正十分位。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-034", "subject": "數學", "topic": "數12", "level": "推理", "type": "multi", "stem": "下面哪些算式的答案比 1 大？", "options": ["0.6＋0.5", "0.35＋0.6", "1.2－0.3", "0.9＋0.15", "1.05－0.1"], "answer": [0, 3], "explain": "只有這兩題湊夠一個整體之後還有餘，其餘都不足 1。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-035", "subject": "數學", "topic": "數13", "level": "知道", "type": "mcq", "stem": "一張課室書桌的高度最接近哪一個？", "options": ["75 厘米", "75 毫米", "75 米", "7 厘米"], "answer": 0, "explain": "書桌大約 75 厘米高；75 毫米不夠一個手掌闊，75 米比十層樓還高，7 厘米只及一隻手指。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-036", "subject": "數學", "topic": "數13", "level": "應用", "type": "numpad", "stem": "書架高 1 米 45 厘米，比書桌高 68 厘米。\n書桌高多少厘米？", "answer": 77, "unit": "厘米", "explain": "先把 1 米 45 厘米化成 145 厘米，145 － 68 ＝ 77 厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-037", "subject": "數學", "topic": "數13", "level": "推理", "type": "order", "stem": "把下面四段長度由短到長排好：", "options": ["2 米 40 厘米", "2 100 毫米", "2.5 米", "195 厘米"], "answer": [3, 1, 0, 2], "explain": "全部化成厘米是 240、210、250、195，所以 195 厘米最短、2.5 米最長。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-038", "subject": "數學", "topic": "數14", "level": "應用", "type": "numpad", "stem": "校隊由 3 時 45 分練到 5 時 20 分。\n一共練了多少分鐘？", "answer": 95, "unit": "分鐘", "explain": "3 時 45 分到 5 時 20 分是 1 小時 35 分，60 ＋ 35 ＝ 95 分鐘。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-039", "subject": "數學", "topic": "數14", "level": "應用", "type": "mcq", "stem": "一壺水 2 公升，倒滿 6 杯，每杯 300 毫升。\n壺裏還剩多少毫升？", "options": ["200 毫升", "1 800 毫升", "3 800 毫升", "1 400 毫升"], "answer": 0, "explain": "6 杯共 6 × 300 ＝ 1 800 毫升，2 公升 ＝ 2 000 毫升，2 000 － 1 800 ＝ 200 毫升。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-040", "subject": "數學", "topic": "數14", "level": "推理", "type": "multi", "stem": "下面哪些時間長度超過 1 小時？", "options": ["70 分鐘", "1 時 5 分", "55 分鐘", "60 分鐘", "1 時 40 分"], "answer": [0, 1, 4], "explain": "化成分鐘是 70、65、55、60、100，只有多於 60 分鐘的才算超過，60 分鐘剛好等於 1 小時。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-041", "subject": "數學", "topic": "數15", "level": "應用", "type": "numpad", "stem": "一個正五邊形每邊 8 厘米。用同樣長的鐵線改圍\n一個正方形，正方形邊長是多少厘米？", "answer": 10, "unit": "厘米", "explain": "五邊形周界 8 × 5 ＝ 40 厘米，鐵線一樣長，40 ÷ 4 ＝ 10 厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-042", "subject": "數學", "topic": "數15", "level": "推理", "type": "multi", "stem": "下面哪些圖形的周界剛好是 24 厘米？", "options": ["邊長 6 厘米正方形", "長 8 闊 4 長方形", "邊長 8 厘米正三角形", "長 10 闊 4 長方形", "邊長 5 厘米正方形"], "answer": [0, 1, 2], "explain": "6 × 4、(8 ＋ 4) × 2、8 × 3 都等於 24 厘米，另外兩個是 28 厘米和 20 厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-043", "subject": "數學", "topic": "數16", "level": "知道", "type": "mcq", "stem": "每格 1 平方厘米。圖形蓋住 9 個整格、6 個半格。\n面積是多少？", "options": ["12 平方厘米", "15 平方厘米", "9 平方厘米", "3 平方厘米"], "answer": 0, "explain": "兩個半格合成一個整格，6 個半格等於 3 格，9 ＋ 3 ＝ 12 平方厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-044", "subject": "數學", "topic": "數16", "level": "應用", "type": "numpad", "stem": "用邊長 1 厘米的小正方體砌長方體，底層 6 行\n3 列，砌 3 層。體積是多少立方厘米？", "answer": 54, "unit": "立方厘米", "explain": "一層 6 × 3 ＝ 18 個，3 層共 18 × 3 ＝ 54 個，即 54 立方厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-045", "subject": "數學", "topic": "數16", "level": "推理", "type": "order", "stem": "四個長方體的長闊高如下，把體積由小到大排：", "options": ["2 × 3 × 4", "5 × 2 × 2", "3 × 3 × 3", "1 × 6 × 5"], "answer": [1, 0, 2, 3], "explain": "三個數相乘得 24、20、27、30，所以 5 × 2 × 2 最小、1 × 6 × 5 最大。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-046", "subject": "數學", "topic": "數17", "level": "知道", "type": "mcq", "stem": "兩條直線相交成直角，這兩條直線的關係叫甚麼？", "options": ["互相平行", "互相垂直", "互相重疊", "互相對稱"], "answer": 1, "explain": "相交成直角的兩條直線叫互相垂直，平行線則永遠不會相交。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-047", "subject": "數學", "topic": "數17", "level": "應用", "type": "multi", "stem": "下面哪些大寫字母有一對互相平行的線？", "options": ["E", "L", "N", "T", "V"], "answer": [0, 2], "explain": "E 的三條橫線互相平行，N 的兩條直線互相平行；L 和 T 的兩條線互相垂直，V 的兩條線相交。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-048", "subject": "數學", "topic": "數18", "level": "知道", "type": "mcq", "stem": "把一個平角平均分成 3 份，每份是多少度？", "options": ["30 度", "60 度", "90 度", "120 度"], "answer": 1, "explain": "平角是 180 度，180 ÷ 3 ＝ 60 度。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-049", "subject": "數學", "topic": "數18", "level": "應用", "type": "order", "stem": "把下面四個角由小到大排好：", "options": ["平角的三分之一", "直角", "兩個直角", "直角的一半"], "answer": [3, 0, 1, 2], "explain": "四個角分別是 60 度、90 度、180 度、45 度，所以直角的一半最小、兩個直角最大。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-050", "subject": "數學", "topic": "數19", "level": "應用", "type": "mcq", "stem": "在一個邊長 10 厘米的正方形裏畫一個最大的圓。\n這個圓的半徑是多少厘米？", "options": ["5 厘米", "10 厘米", "20 厘米", "2.5 厘米"], "answer": 0, "explain": "最大的圓的直徑剛好等於正方形的邊長 10 厘米，半徑是 10 ÷ 2 ＝ 5 厘米。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-051", "subject": "數學", "topic": "數19", "level": "推理", "type": "multi", "stem": "下面哪些說法一定正確？", "options": ["正方形是長方形", "長方形是正方形", "正方形有四個直角", "梯形有兩組對邊平行", "四邊形都有四條邊"], "answer": [0, 2, 4], "explain": "正方形符合長方形的全部條件，而長方形的邊不一定全相等，梯形只有一組對邊平行。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-052", "subject": "數學", "topic": "數20", "level": "知道", "type": "mcq", "stem": "一個三角柱體有多少個面？", "options": ["3 個", "4 個", "5 個", "6 個"], "answer": 2, "explain": "三角柱體有上下兩個三角形面，加三個長方形側面，共 5 個面。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-053", "subject": "數學", "topic": "數20", "level": "推理", "type": "multi", "stem": "一個立體的 6 個面全是長方形。\n下面哪些一定正確？", "options": ["它有 12 條邊", "它有 8 個頂點", "它一定是正方體", "它可以滾動", "它有一個曲面"], "answer": [0, 1], "explain": "6 個長方形面的立體是長方體，一定有 12 條邊（棱）和 8 個頂點；它的邊不一定全相等，也沒有曲面可以滾。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-054", "subject": "數學", "topic": "數21", "level": "應用", "type": "mcq", "stem": "四班收集舊電池數：\n甲 36、乙 48、丙 27、丁 45\n乙丁合共比甲丙合共多多少？", "options": ["30 個", "156 個", "21 個", "9 個"], "answer": 0, "explain": "乙丁 48 ＋ 45 ＝ 93，甲丙 36 ＋ 27 ＝ 63，93 － 63 ＝ 30 個。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-055", "subject": "數學", "topic": "數21", "level": "應用", "type": "order", "stem": "兩場比賽得分：\n紅隊 25、38\n藍隊 40、19\n黃隊 31、30\n總分由多到少排：", "options": ["紅隊", "藍隊", "黃隊"], "answer": [0, 2, 1], "explain": "紅隊 63 分、藍隊 59 分、黃隊 61 分，所以紅隊最多、藍隊最少。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-056", "subject": "數學", "topic": "數22", "level": "應用", "type": "numpad", "stem": "運動會報名：\n甲班 男 18、女 22\n乙班 男 25、女 ？\n兩班共 100 人，乙班女生多少人？", "answer": 35, "unit": "人", "explain": "已知三格合計 18 ＋ 22 ＋ 25 ＝ 65，100 － 65 ＝ 35 人。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-057", "subject": "數學", "topic": "數22", "level": "推理", "type": "mcq", "stem": "棒形圖直軸一格代表 5 人。原本 6 格高的棒，\n改成一格代表 2 人後要畫多少格高？", "options": ["15 格", "6 格", "12 格", "30 格"], "answer": 0, "explain": "6 格代表 6 × 5 ＝ 30 人，人數沒有變，30 ÷ 2 ＝ 15 格。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-058", "subject": "數學", "topic": "數23", "level": "應用", "type": "mcq", "stem": "每包種子可種 6 盆。\n甲班買 5 包、乙班買 4 包、丙班買 7 包\n三班一共可種多少盆？", "options": ["96 盆", "16 盆", "42 盆", "30 盆"], "answer": 0, "explain": "三班共 5 ＋ 4 ＋ 7 ＝ 16 包，每包 6 盆，16 × 6 ＝ 96 盆。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-059", "subject": "數學", "topic": "數23", "level": "推理", "type": "multi", "stem": "甲班 20 人、乙班 25 人。\n回收膠樽：甲班 60 個、乙班 70 個。\n哪些結論一定成立？", "options": ["乙班回收得比甲班多", "甲班平均每人 3 個", "乙班平均每人較多", "乙班同學較愛護環境", "兩班共回收 130 個"], "answer": [0, 1, 4], "explain": "70 > 60、60 ÷ 20 ＝ 3、60 ＋ 70 ＝ 130 都由數據直接得出；乙班 25 人若每人 3 個要 75 個，實際只有 70 個，平均反而較少，而愛不愛護環境資料裏並沒有。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-M-2026-09-060", "subject": "數學", "topic": "數23", "level": "推理", "type": "order", "stem": "每盒價錢（元）：甲 12、乙 15、丙 9、丁 20\n買入盒數：甲 3、乙 2、丙 5、丁 1\n付錢由少到多排：", "options": ["甲", "乙", "丙", "丁"], "answer": [3, 1, 0, 2], "explain": "價錢乘盒數得甲 36 元、乙 30 元、丙 45 元、丁 20 元，所以丁最少、丙最多。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-001", "subject": "科學", "topic": "科04", "level": "應用", "type": "order", "stem": "把青蛙一生的階段按先後排好：", "options": ["有腳的蝌蚪", "成蛙", "卵", "沒有腳的蝌蚪"], "answer": [2, 3, 0, 1], "explain": "卵孵出蝌蚪，先長後腿再長前腿，尾巴消失後變成蛙。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-002", "subject": "科學", "topic": "科01", "level": "知道", "type": "mcq", "stem": "下面哪一樣是生物？", "options": ["會走動的玩具狗", "河邊的石頭", "樹上的青苔", "飄動的雲"], "answer": 2, "explain": "青苔會生長和繁殖；玩具狗會動但不會生長。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-003", "subject": "科學", "topic": "科01", "level": "應用", "type": "mcq", "stem": "三樣東西放在窗台三星期後：\n甲長高並長出新葉，乙生了鏽，丙裂成兩半。\n哪一樣是生物？", "options": ["甲", "乙", "丙", "三樣都是"], "answer": 0, "explain": "只有生物會生長、長出新的部分；生鏽和裂開都不是生長。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-004", "subject": "科學", "topic": "科02", "level": "知道", "type": "mcq", "stem": "下面哪一項是所有哺乳類都有的特徵？", "options": ["用奶餵養幼兒", "會在天上飛", "身上有鱗片", "在水中生活"], "answer": 0, "explain": "哺乳類都用奶餵養幼兒；會不會飛、住在哪裏都不是分類的準則。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-005", "subject": "科學", "topic": "科02", "level": "應用", "type": "multi", "stem": "街市裏的五種動物，哪些身體裏沒有背骨？", "options": ["蝦", "鯪魚", "蟹", "雞", "蜆"], "answer": [0, 2, 4], "explain": "蝦、蟹、蜆都沒有背骨，屬無脊椎動物；鯪魚和雞有背骨。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-006", "subject": "科學", "topic": "科02", "level": "推理", "type": "mcq", "stem": "蝸牛和烏龜都背着硬殼，\n為甚麼牠們不是同一類？", "options": ["烏龜有背骨，蝸牛沒有", "烏龜的殼比較大", "蝸牛住在草地上", "烏龜會游泳"], "answer": 0, "explain": "分類看身體特徵，烏龜有背骨、蝸牛沒有，外表相似不代表同類。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-007", "subject": "科學", "topic": "科03", "level": "應用", "type": "order", "stem": "水從泥土進入木棉樹後經過的次序：", "options": ["莖", "葉", "根"], "answer": [2, 0, 1], "explain": "根從泥土吸水，莖把水運上去，最後送到葉。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-008", "subject": "科學", "topic": "科03", "level": "應用", "type": "numpad", "stem": "同樣的小白菜苗，兩星期後量高度：\n陽光下 14 厘米，樹蔭下 6 厘米。\n相差多少厘米？", "answer": 8, "unit": "厘米", "explain": "葉要用陽光製造養分，陽光足夠的一盆長得較高：14 − 6 ＝ 8。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-009", "subject": "科學", "topic": "科03", "level": "推理", "type": "multi", "stem": "一棵小樹的根大部分被蟲咬斷。\n最可能出現哪些情況？", "options": ["吸到的水減少", "葉子變得枯黃", "容易被風吹倒", "花會變成另一種顏色", "葉會變成尖刺"], "answer": [0, 1, 2], "explain": "根負責吸水和固定植物，根壞了會同時影響吸水和支撐，花色和葉形卻不會改變。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-010", "subject": "科學", "topic": "科04", "level": "應用", "type": "numpad", "stem": "蝴蝶各階段的日數：\n卵 4 天、幼蟲 15 天、蛹 9 天。\n由卵到成蟲共要多少天？", "answer": 28, "unit": "天", "explain": "把三個階段的日數加起來：4 ＋ 15 ＋ 9 ＝ 28。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-011", "subject": "科學", "topic": "科04", "level": "推理", "type": "mcq", "stem": "蝗蟲的幼蟲像小蝗蟲，只是沒有翅膀；\n蝴蝶的幼蟲卻是毛蟲。這說明甚麼？", "options": ["有些昆蟲幼體像成體", "蝗蟲不是昆蟲", "毛蟲會長成蝗蟲", "昆蟲都有蛹的階段"], "answer": 0, "explain": "有些昆蟲的幼體和成體相似，不是所有昆蟲都要經過樣子完全不同的階段。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-012", "subject": "科學", "topic": "科05", "level": "應用", "type": "mcq", "stem": "小明的爸爸眼睛深褐色、手臂有一道疤、會說葡語。\n小明出生時可能有哪一樣？", "options": ["深褐色的眼睛", "手臂的疤", "說葡語的能力", "三樣都有"], "answer": 0, "explain": "眼睛的顏色由父母遺傳；疤痕和語言都是出生後才有的。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-013", "subject": "科學", "topic": "科05", "level": "推理", "type": "multi", "stem": "下面哪些特徵，父母有可能遺傳給子女？", "options": ["天生的頭髮顏色", "雙眼皮", "曬黑的皮膚", "學會的普通話", "眼睛的顏色"], "answer": [0, 1, 4], "explain": "天生的外形特徵可以遺傳；曬黑和學會的說話都是後天得來的。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-014", "subject": "科學", "topic": "科06", "level": "應用", "type": "multi", "stem": "住在海邊石縫裏的螃蟹，哪些特徵幫助牠生存？", "options": ["硬殼保護身體", "身體顏色像石頭", "危險時躲進石縫", "用奶餵幼兒", "會開花結果"], "answer": [0, 1, 2], "explain": "硬殼、保護色和躲進石縫都能避開敵人和風浪，餵奶和開花不是螃蟹會做的事。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-015", "subject": "科學", "topic": "科06", "level": "推理", "type": "mcq", "stem": "海邊常常刮大風。生長在那裏的樹，\n最可能有甚麼特徵？", "options": ["根又粗又廣", "樹幹又高又細", "葉又大又薄", "沒有樹皮"], "answer": 0, "explain": "又粗又廣的根能緊緊抓住泥土，大風吹來也不容易倒下。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-016", "subject": "科學", "topic": "科07", "level": "推理", "type": "mcq", "stem": "河邊的樹被砍光，泥土沖進河裏，河水變混濁。\n河裏的水草會怎樣？", "options": ["陽光減少，長得差", "長得更快更高", "完全不受影響", "變成水中的動物"], "answer": 0, "explain": "水變混濁後射入水中的陽光減少，水草造不到足夠養分，就長得差。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-017", "subject": "科學", "topic": "科08", "level": "應用", "type": "multi", "stem": "海邊石灘這個生態系統裏，哪些是非生物部分？", "options": ["海水", "陽光", "海螺", "沙石", "海藻"], "answer": [0, 1, 3], "explain": "生態系統由生物和非生物共同組成，海水、陽光、沙石都是非生物。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-018", "subject": "科學", "topic": "科09", "level": "應用", "type": "order", "stem": "海邊的食物鏈，由被吃的排到吃的：", "options": ["螃蟹", "海藻", "海鷗", "海螺"], "answer": [1, 3, 0, 2], "explain": "食物鏈由自己製造養分的海藻開始，箭嘴指向吃牠的一方。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-019", "subject": "科學", "topic": "科09", "level": "推理", "type": "numpad", "stem": "一片草地的草夠養 360 隻蟋蟀，\n每 18 隻蟋蟀才夠養 1 隻蜥蜴。\n最多可養多少隻蜥蜴？", "answer": 20, "unit": "隻", "explain": "食物鏈越上一層，能養活的數目越少：360 ÷ 18 ＝ 20。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-020", "subject": "科學", "topic": "科10", "level": "知道", "type": "mcq", "stem": "兩隻麻雀爭奪同一個樹洞做巢，這叫做甚麼？", "options": ["競爭", "捕食", "遺傳", "適應"], "answer": 0, "explain": "兩個生物爭同一樣有限的東西（食物、水、空間），就是競爭。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-021", "subject": "科學", "topic": "科10", "level": "推理", "type": "numpad", "stem": "公園本來有 24 隻麻雀。\n放入一群吃同樣食物的鴿子後，只剩 9 隻。\n少了多少隻？", "answer": 15, "unit": "隻", "explain": "鴿子和麻雀爭奪同樣的食物，食物有限，麻雀分到的少了：24 − 9 ＝ 15。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-022", "subject": "科學", "topic": "科11", "level": "知道", "type": "order", "stem": "把洗手的步驟按先後排好：", "options": ["用肥皂搓 20 秒", "用清水沖乾淨", "用水弄濕雙手", "用乾淨毛巾抹乾"], "answer": [2, 0, 1, 3], "explain": "先弄濕再用肥皂搓，把病菌搓下來後沖走，最後抹乾才不易再沾上病菌。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-023", "subject": "科學", "topic": "科17", "level": "推理", "type": "multi", "stem": "小美想讓一粒方糖在水中更快溶解。哪些做法有效？", "options": ["把水加熱", "把方糖壓碎", "用更大的杯", "不停攪拌", "把水放進雪櫃"], "answer": [0, 1, 3], "explain": "加熱、壓碎、攪拌都能加快溶解；杯的大小無關，冷卻反而變慢。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-024", "subject": "科學", "topic": "科22", "level": "應用", "type": "numpad", "stem": "一杯熱水放在桌上，每 5 分鐘量一次溫度：\n0 分鐘 80°C、5 分鐘 68°C、10 分鐘 59°C。\n這 10 分鐘水溫共下降了多少度？", "answer": 21, "unit": "°C", "explain": "80 − 59 = 21；熱由較熱的水傳到較冷的空氣。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-025", "subject": "科學", "topic": "科12", "level": "知道", "type": "mcq", "stem": "下面哪一樣東西有固定的體積，但沒有固定的形狀？", "options": ["牛奶", "石頭", "空氣", "冰"], "answer": 0, "explain": "液體有固定的體積，形狀會隨容器改變；石頭和冰是固體，空氣是氣體。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-026", "subject": "科學", "topic": "科12", "level": "推理", "type": "multi", "stem": "甲：形狀和體積都固定；乙：只有體積固定；丙：兩樣都不固定。\n哪些說法正確？", "options": ["甲是固體", "乙可以是食油", "丙會充滿整個容器", "丙是冰", "乙倒進碗會變成碗形"], "answer": [0, 1, 2, 4], "explain": "三態的分別在於形狀和體積是否固定，這個規律對水以外的物質同樣適用。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-027", "subject": "科學", "topic": "科13", "level": "知道", "type": "multi", "stem": "下面哪些東西是絕緣體，電流不能通過？", "options": ["木筷子", "鋁罐", "橡皮擦", "銅線", "膠尺"], "answer": [0, 2, 4], "explain": "金屬能讓電流通過，是導電體；木、橡膠和塑膠不能，是絕緣體。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-028", "subject": "科學", "topic": "科14", "level": "應用", "type": "order", "stem": "杯裏混了迴紋針、沙和鹽。把分開的步驟排好：", "options": ["加水攪拌，讓鹽溶解", "把鹽水蒸發，取回鹽", "用磁鐵吸走迴紋針", "過濾，沙留在濾紙上"], "answer": [2, 0, 3, 1], "explain": "先用磁鐵取走能被吸的迴紋針，再利用鹽溶於水而沙不溶，過濾後蒸發便取回鹽。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-029", "subject": "科學", "topic": "科14", "level": "推理", "type": "mcq", "stem": "小明把糖水倒進濾紙，想濾出糖，濾紙上卻甚麼也沒有。\n為甚麼？", "options": ["糖已溶解，粒太小穿過濾紙", "糖已經消失了", "濾紙太薄", "糖變成了水"], "answer": 0, "explain": "溶解後的糖化成極小的粒混在水中，能穿過濾紙，要蒸發水分才取得回來。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-030", "subject": "科學", "topic": "科15", "level": "知道", "type": "mcq", "stem": "把兩塊磁鐵的北極和北極慢慢推近，會怎樣？", "options": ["互相推開", "互相吸住", "兩塊都失去磁性", "完全沒有反應"], "answer": 0, "explain": "磁鐵同極相斥、異極相吸，兩個北極互相排斥，所以會推開。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-031", "subject": "科學", "topic": "科16", "level": "應用", "type": "multi", "stem": "下面哪些是化學變化？", "options": ["切開的蘋果變褐色", "雪糕融化成液體", "燒烤時木炭變成灰", "把汽水倒進杯裏", "把麵粉搓成麵團"], "answer": [0, 2], "explain": "化學變化會產生新的物質而且變不回來；融化、傾倒和搓揉只是改變形狀或狀態。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-032", "subject": "科學", "topic": "科16", "level": "推理", "type": "mcq", "stem": "同一塊麵包：甲塊烤到焦黑，乙塊被撕成碎塊。\n哪一句正確？", "options": ["甲化學，乙物理", "兩塊都是化學變化", "甲物理，乙化學", "兩塊都是物理變化"], "answer": 0, "explain": "烤焦產生了新的物質，變不回原來的麵包，是化學變化；撕碎只改變形狀，是物理變化。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-033", "subject": "科學", "topic": "科17", "level": "應用", "type": "mcq", "stem": "四杯水只有溫度不同，同樣的糖溶完所需時間：\n甲 5 分、乙 2 分、丙 8 分、丁 3 分。\n哪一杯的水最熱？", "options": ["乙", "甲", "丙", "丁"], "answer": 0, "explain": "水越熱，糖溶得越快；乙用的時間最短，所以乙杯的水最熱。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-034", "subject": "科學", "topic": "科18", "level": "應用", "type": "numpad", "stem": "兩杯各 100 克水。甲杯溶了 15 克糖，乙杯溶了 40 克糖。\n甲杯要再加多少克糖，才和乙杯一樣甜？", "answer": 25, "unit": "克", "explain": "水量相同時糖越多越甜；40 − 15 ＝ 25，加 25 克糖兩杯就一樣甜。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-035", "subject": "科學", "topic": "科18", "level": "推理", "type": "mcq", "stem": "甲杯：10 克糖溶在 50 克水。\n乙杯：15 克糖溶在 150 克水。\n哪一杯較甜？", "options": ["甲杯，水少很多", "乙杯，因為糖較多", "兩杯一樣甜", "乙杯，因為水較多"], "answer": 0, "explain": "濃度要看糖和水的比例：甲杯每 5 克水有 1 克糖，乙杯每 10 克水才有 1 克糖。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-036", "subject": "科學", "topic": "科19", "level": "知道", "type": "mcq", "stem": "下面哪一組全部都是能源？", "options": ["風、流水、石油氣", "風、磁鐵、石頭", "陽光、沙、鐵線", "煤、膠袋、玻璃"], "answer": 0, "explain": "太陽、風、流水、煤、石油和石油氣都能提供能量，是能源；磁鐵、沙、膠袋只是物料。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-037", "subject": "科學", "topic": "科20", "level": "應用", "type": "numpad", "stem": "同一枝竹在空地上的影子長度：\n上午 9 時 120 厘米，中午 12 時 40 厘米。\n相差多少厘米？", "answer": 80, "unit": "厘米", "explain": "太陽越高，影子越短；中午太陽最高，120 − 40 ＝ 80。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-038", "subject": "科學", "topic": "科21", "level": "知道", "type": "mcq", "stem": "用手指彈一下結他的弦，會聽到聲音。聲音是怎樣來的？", "options": ["弦在快速振動", "弦變熱了", "手指用了力氣", "空氣停止流動"], "answer": 0, "explain": "物體振動才會發出聲音，按停弦的振動，聲音就立刻停止。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-039", "subject": "科學", "topic": "科23", "level": "應用", "type": "mcq", "stem": "電筒裏有電池、燈泡和開關，按下開關後燈亮了。\n開關的作用是甚麼？", "options": ["把電路的缺口合上", "令電池產生更多電", "把燈光反射出去", "令電線變粗"], "answer": 0, "explain": "開關是電路上一個可以打開和合上的缺口，合上後電流才走得完整個圈。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-040", "subject": "科學", "topic": "科23", "level": "推理", "type": "multi", "stem": "下面哪些接法能令燈泡亮起來？", "options": ["電池、電線、燈泡接成圈", "電線只接電池一端", "圈中夾着一條鐵釘", "圈中夾着一塊橡皮", "電池兩端各接一線到燈"], "answer": [0, 2, 4], "explain": "電流要沿着完整的圈流動；圈有缺口或夾着絕緣體都不亮，夾着金屬仍然是通路。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-041", "subject": "科學", "topic": "科24", "level": "應用", "type": "mcq", "stem": "守門員把飛來的足球接住，球停了下來。\n這說明力可以做甚麼？", "options": ["令運動中的物體停下", "令物體變重", "令物體發聲", "令物體變熱"], "answer": 0, "explain": "力可以令靜止的物體動起來，也可以令運動中的物體變慢、轉向或停下。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-042", "subject": "科學", "topic": "科24", "level": "推理", "type": "order", "stem": "同一架玩具車用同樣的力推出，在三種地面滑行。\n由滑得最遠排到最近：", "options": ["鋪了沙的地面", "光滑的瓷磚地", "粗糙的水泥地"], "answer": [1, 2, 0], "explain": "地面越粗糙，摩擦力越大，車滑行的距離越短。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-043", "subject": "科學", "topic": "科25", "level": "應用", "type": "mcq", "stem": "用螺絲批的柄撬起油漆罐蓋，罐邊是支點。\n螺絲批在這裏是甚麼？", "options": ["槓桿", "斜面", "磁鐵", "滑輪"], "answer": 0, "explain": "有支點、能用較小的力撬起東西的長棒就是槓桿，它幫我們省力。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-044", "subject": "科學", "topic": "科26", "level": "知道", "type": "order", "stem": "把地球表面這三樣由多到少排好：", "options": ["陸地", "河湖的淡水", "海洋的鹹水"], "answer": [2, 0, 1], "explain": "地球表面約七成是水，當中絕大部分是海洋的鹹水，陸地約三成，河湖的淡水最少。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-045", "subject": "科學", "topic": "科27", "level": "知道", "type": "mcq", "stem": "玻璃窗主要用哪一種地球資源造成？", "options": ["沙", "木材", "煤", "海水"], "answer": 0, "explain": "玻璃是把沙高溫熔化後造成的，沙是地球上的礦物資源。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-046", "subject": "科學", "topic": "科28", "level": "應用", "type": "multi", "stem": "下面哪些資源用了以後，在人類的時間內還會再有？", "options": ["陽光", "海浪", "石油", "竹", "鋁礦"], "answer": [0, 1, 3], "explain": "可再生資源能源源不絕或短時間內長回來；石油和鋁礦要幾百萬年才形成，用一分少一分。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-047", "subject": "科學", "topic": "科28", "level": "推理", "type": "numpad", "stem": "山上每年長成 400 棵新樹。\n如果每年砍去 700 棵，樹木每年淨減少多少棵？", "answer": 300, "unit": "棵", "explain": "可再生資源也要補充得上才用不完：700 − 400 ＝ 300，森林仍會慢慢消失。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-048", "subject": "科學", "topic": "科29", "level": "應用", "type": "mcq", "stem": "河流轉彎的地方，哪一邊的河岸被沖得最厲害？", "options": ["水流較快的外彎", "水流較慢的內彎", "兩邊一樣厲害", "只有河底會被沖"], "answer": 0, "explain": "轉彎處外側水流較快，侵蝕較強；內側水流慢，反而堆積泥沙。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-049", "subject": "科學", "topic": "科29", "level": "推理", "type": "order", "stem": "有尖角的石頭掉進河裏，被水沖了很多年。\n把它的樣子按先後排好：", "options": ["表面光滑的圓卵石", "有尖角的大石", "角磨鈍了的石塊"], "answer": [1, 2, 0], "explain": "石頭在水中互相碰撞磨擦，尖角一點點被磨掉，時間越長越圓滑。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-050", "subject": "科學", "topic": "科30", "level": "應用", "type": "order", "stem": "崖壁的岩層由上至下是甲、乙、丙，各層都有化石。\n把岩層由最舊排到最新：", "options": ["乙", "甲", "丙"], "answer": [2, 0, 1], "explain": "泥沙一層層由下往上堆積，所以最下面的一層最舊，最上面的一層最新。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-051", "subject": "科學", "topic": "科30", "level": "推理", "type": "mcq", "stem": "在一片沙漠的岩石裏找到很多珊瑚化石。\n這說明甚麼？", "options": ["這裏從前是海", "珊瑚能在沙漠生長", "有人把珊瑚埋在這裏", "沙漠正在變成海"], "answer": 0, "explain": "珊瑚只能生活在海裏，岩石中有珊瑚化石，說明這個地方從前是海。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-052", "subject": "科學", "topic": "科31", "level": "應用", "type": "numpad", "stem": "同一天中午的氣溫：\n澳門 31°C、上海 12°C、昆明 22°C。\n澳門比上海高多少度？", "answer": 19, "unit": "°C", "explain": "同一天不同地方的天氣可以相差很遠：31 − 12 ＝ 19。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-053", "subject": "科學", "topic": "科32", "level": "應用", "type": "order", "stem": "把地球暖化發生的過程按先後排好：", "options": ["地球氣溫上升", "燒煤和石油發電", "海平面上升", "空氣中二氧化碳增多"], "answer": [1, 3, 0, 2], "explain": "燒化石燃料放出二氧化碳，二氧化碳把熱留住令氣溫上升，冰融化後海平面就上升。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-054", "subject": "科學", "topic": "科32", "level": "推理", "type": "multi", "stem": "地球暖化會帶來哪些影響？", "options": ["冰川融化", "海平面上升", "地球轉得更快", "極端天氣增多", "白天變得更長"], "answer": [0, 1, 3], "explain": "暖化令冰融化、海水上升、天氣更極端；地球自轉和白天長短與氣溫無關。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-055", "subject": "科學", "topic": "科33", "level": "知道", "type": "order", "stem": "把這四顆行星按離太陽由近到遠排好：", "options": ["金星", "地球", "火星", "水星"], "answer": [3, 0, 1, 2], "explain": "太陽系由內向外依次是水星、金星、地球、火星，地球是第三顆行星。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-056", "subject": "科學", "topic": "科34", "level": "應用", "type": "order", "stem": "把月相按出現的先後排好：", "options": ["滿月", "新月", "下弦月", "上弦月"], "answer": [1, 3, 0, 2], "explain": "月球繞地球轉一圈約一個月，月相由新月、上弦月、滿月到下弦月再回到新月。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-057", "subject": "科學", "topic": "科34", "level": "推理", "type": "numpad", "stem": "連續兩次滿月相隔約 30 天。\n由滿月到新月大約要多少天？", "answer": 15, "unit": "天", "explain": "新月剛好在兩次滿月的中間，是整個月相週期的一半：30 ÷ 2 ＝ 15。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-058", "subject": "科學", "topic": "科35", "level": "應用", "type": "numpad", "stem": "地球自轉一圈是 24 小時。\n由中午轉到午夜剛好是半圈，要多少小時？", "answer": 12, "unit": "小時", "explain": "地球自轉一圈 24 小時形成一次日夜交替：24 ÷ 2 ＝ 12。", "source_note": "原創，未見於練習冊／校本"}, {"id": "G-S-2026-09-059", "subject": "科學", "topic": "科36", "level": "應用", "type": "numpad", "stem": "澳門的日照時間：6 月某天 13 小時，12 月某天 10 小時。\n相差多少小時？", "answer": 3, "uni       btns.push(b); el.appendChild(b);
    });
    function pick(pos) {

      btns[pos].classList.add("picked"); onSubmit(q.view[pos]);

    return {
      lock() { done = true; },
      reveal(correct) {
        btns.forEach(b => { const oi = +b.dataset.oi;

          else if (b.classList.contains("picked")) b.classList.add("wrong");

<script>
/* src/types/numpad.js */
/* 數字輸入：每隊一個 0–9、小數點、負號、退格的鍵盤，按「確定」交卷。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  function parse(s) {
    if (typeof s !== "string") return NaN;
    const t = s.trim().replace(/\.$/, "");
    if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
    return Number(t);
  }

  function judge(item, response) {
    const v = parse(response);
    if (Number.isNaN(v)) return false;
    const tol = item.tolerance || 0;
    return Math.abs(v - item.answer) <= tol + 1e-9;
  }

    el.innerHTML = ""; el.className = "body col";
    let done = false, val = "";
    const disp = document.createElement("div"); disp.className = "np-display";
    const unit = q.unit ? `<small>${q.unit}</small>` : "";
    const show = () => { disp.innerHTML = (val || "&nbsp;") + unit; ok.disabled = Number.isNaN(parse(val)); };
    const keys = document.createElement("div"); keys.className = "np-keys";
    ["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", ".", "0"].forEach(k => {
      const b = document.createElement("button"); b.textContent = k;
      if (k === "0") b.style.gridColumn = "span 2";
      b.addEventListener("pointerdown", e => { e.preventDefault(); key(k); });
      keys.appendChild(b);
    });
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定";

    return {
      lock() { done = true; ok.disabled = true; },
      reveal(correct) {
        disp.classList.add(correct ? "right" : "wrong");
        disp.style.background = correct ? "#CFF3D8" : "#FBD5D3";
        if (!correct) disp.innerHTML = `<s style="opacity:.6">${val || "—"}</s>　${q.answer}${unit}`;
      },

  }

  T.types.numpad = { judge, render, parse, limit: 45, submitOnPick: false };
})();

<script>

    return Array.isArray(response) && response.length === item.answer.length
      && response.every((v, i) => v === item.answer[i]);
  }

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body col";
    let done = false, selected = -1, drag = null;
    let cur = q.view.slice();                      // 目前排列：位置 → 選項索引
    const list = document.createElement("div"); list.className = "ord";
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定";
    ok.addEventListener("pointerdown", e => { e.preventDefault(); submit(); });
    el.append(list, ok);
    function draw() {
      list.innerHTML = "";
      cur.forEach((oi, pos) => {
        const b = document.createElement("button"); b.className = "opt" + (pos === selected ? " sel" : ""); b.dataset.oi = oi;
        b.innerHTML = `<b>${pos + 1}</b><span>${q.options[oi]}</span>`;
        b.addEventListener("pointerdown", e => { e.preventDefault(); startDrag(e, pos, b); });
        list.appendChild(b);
      });
    }
    // 拖拉：按住卡片上下移動即重排；沒有移動就當作點選（點兩張交換）。每張卡各自捕捉指標，兩隊可同時拖。
    function startDrag(e, pos, btn) {
      if (done || drag) return;
      const slots = [...list.children].map(c => c.getBoundingClientRect());
      const rowH = slots.length > 1 ? slots[1].top - slots[0].top : (slots[0] ? slots[0].height : 0);
      drag = { id: e.pointerId, from: pos, to: pos, startY: e.clientY, moved: false };
      try { btn.setPointerCapture(e.pointerId); } catch { /* 舊瀏覽器 */ }
      const move = ev => {
        if (!drag || ev.pointerId !== drag.id) return;
        const dy = ev.clientY - drag.startY;
        if (!drag.moved && Math.abs(dy) < 8) return;
        if (!drag.moved) { drag.moved = true; btn.classList.add("dragging"); }
        btn.style.transform = `translateY(${dy}px)`;
        let to = slots.findIndex(r => ev.clientY < r.top + r.height / 2); if (to === -1) to = slots.length - 1;

        [...list.children].forEach((c, i) => {

        } else tap(pos);

      btn.addEventListener("pointermove", move); btn.addEventListener("pointerup", up); btn.addEventListener("pointercancel", up);
    }
    function tap(pos) {
      if (done) return;
      if (selected === -1) selected = pos;
      else if (selected === pos) selected = -1;
      else { [cur[selected], cur[pos]] = [cur[pos], cur[selected]]; selected = -1; }
      draw();
    }
    function submit() { if (done) return; done = true; ok.disabled = true; selected = -1; draw(); onSubmit(cur.slice()); }
    draw();
    return {
      lock() { done = true; ok.disabled = true; },
      reveal(correct) {
        [...list.children].forEach((b, pos) => b.classList.add(cur[pos] === q.answer[pos] ? "right" : "wrong"));
        if (!correct) {
          const ans = document.createElement("div"); ans.style.cssText = "font-size:2.6vh;font-weight:700;margin-top:.6vh";
          ans.textContent = "正確順序：" + q.answer.map(oi => q.options[oi]).join(" → ");

        }
      },
      press() {},
    };
  }

  T.types.order = { judge, render, limit: 45, submitOnPick: false };
})();

<script>
/* src/types/multi.js */
/* 多選：五個選項可切換勾選，按「確定」交卷；必須完全正確。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  function judge(item, response) {
    if (!Array.isArray(response) || !response.length) return false;
    const a = [...new Set(response)].sort((x, y) => x - y);
    const b = [...item.answer].sort((x, y) => x - y);
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body col";
    let done = false; const btns = []; const sel = new Set();
    q.view.forEach((oi, pos) => {
      const b = document.createElement("button"); b.className = "opt"; b.dataset.oi = oi;
      b.innerHTML = `<b>${pos + 1}</b><span>${q.options[oi]}</span>`;
      b.addEventListener("pointerdown", e => { e.preventDefault(); toggle(pos); });
      btns.push(b); el.appendChild(b);
    });
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定"; ok.disabled = true;
    ok.addEventListener("pointerdown", e => { e.preventDefault(); submit(); });
    el.appendChild(ok);
    function toggle(pos) {
      if (done || !btns[pos]) return;
      const oi = q.view[pos];
      if (sel.has(oi)) { sel.delete(oi); btns[pos].classList.remove("picked"); } else { sel.add(oi); btns[pos].classList.add("picked"); }
      ok.disabled = sel.size === 0;
    }
    function submit() { if (done || !sel.size) return; done = true; ok.disabled = true; onSubmit([...sel]); }
    return {
      lock() { done = true; ok.disabled = true; },
      reveal() {
        btns.forEach(b => { const oi = +b.dataset.oi; const chosen = sel.has(oi), right = q.answer.includes(oi);
          if (right) b.classList.add("right");
          else if (chosen) b.classList.add("wrong");
          else b.classList.add("dim");
          if (right && !chosen) b.classList.add("picked"); });
      },
      press: toggle,
    };
  }

  T.types.multi = { judge, render, limit: 30, submitOnPick: false };
})();

</script>
