  function unlock() { const c = ensure(); if (c && c.state === "suspended") c.resume(); }
  function setMuted(m) { muted = !!m; if (master) master.gain.setTargetAtTime(muted ? 0 : 1, now(), 0.02); try { localStorage.setItem("tug.muted", muted ? "1" : "0"); } catch { /* 忽略 */ } }
  T.audio = { unlock, play(name) { if (!muted && SFX[name]) { ensure(); SFX[name](); } }, startBgm, stopBgm, duck, setMuted, isMuted: () => muted };
})();

</script>
<script>
/* src/engine.js */
/* 搶答拔河引擎。純函數（可在 node 測）在前；DOM 流程在 Task 10 補於檔尾。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.PULL = { "知道": 1, "應用": 1, "推理": 2 };

  // ---------- 隨機 ----------
  T.seededRng = function (seed) {
    let s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  };
  T.shuffle = function (arr, rng) {
    const a = arr.slice(); rng = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  // ---------- 計分 ----------
  // delta < 0 繩結向紅隊（左），> 0 向藍隊（右）
  T.resolve = function ({ pull, ok, ms }) {
    const m = ms.map(v => (typeof v === "number" ? v : Infinity));
    if (ok[0] && ok[1]) {
      if (m[0] === m[1]) return { delta: 0, who: null, msg: "都答對，一樣快！" };
      const fast = m[0] < m[1] ? 0 : 1;
      return { delta: fast === 0 ? -1 : 1, who: fast, msg: "都答對，較快的多拉一格！" };
    }
    if (ok[0]) return { delta: -pull, who: 0, msg: "拉！" };
    if (ok[1]) return { delta: pull, who: 1, msg: "拉！" };
    return { delta: 0, who: null, msg: "都不夠力！" };
  };

  // ---------- 題型分散：同一題型不連續超過 3 題（反覆修補直到無違規或無法改善） ----------
  T.spreadTypes = function (list) {
    const out = list.slice();
    const runAt = (a, i) => { let r = 1; for (let k = i; k > 0 && a[k].type === a[k - 1].type; k--) r++; return r; };   // 以 i 結尾的連續長度
    const violations = a => a.filter((_, k) => runAt(a, k) > 3).length;
    for (let guard = 0; guard < 100; guard++) {
      const cur = violations(out);
      if (cur === 0) break;
      const i = out.findIndex((_, k) => runAt(out, k) > 3);
      let fixed = false;
      for (let j = 0; j < out.length && !fixed; j++) {
        if (out[j].type === out[i].type) continue;
        const trial = out.slice(); [trial[i], trial[j]] = [trial[j], trial[i]];
        if (violations(trial) < cur) { out.splice(0, out.length, ...trial); fixed = true; }
      }
      if (!fixed) break;      // 例如 7 個同題型加 1 個其他：無解，照原樣回傳
    }
    return out;
  };

  // ---------- 顯示順序（兩隊看到同一順序，公平） ----------
  T.prepareView = function (item, rng) {
    const q = Object.assign({}, item);
    if (item.type === "numpad") { q.view = null; return q; }
    const idx = item.options.map((_, i) => i);
    let v = T.shuffle(idx, rng);
    if (item.type === "order") {
      let guard = 0;
      while (v.every((x, i) => x === item.answer[i]) && guard++ < 20) v = T.shuffle(idx, rng);
    }
    q.view = v;
    return q;
  };

  // ---------- 日期 ----------
  T.daysBetween = function (a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); };
  T.todayStr = function (d) { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

  // ---------- 抽題 ----------
  // opts: {n, subject: 數學|科學|混合, scope: taught|all|<主題編號>, taughtSet:Set, recent:Map(id→date), today, rng}
  // 優先次序：新鮮度（14 天內沒出過）> 七三分 > 層次 2/5/3 > 題型平均
  T.pick = function (bank, opts) {
    const rng = opts.rng || Math.random;
    const n = opts.n || 10;
    const notes = { fallbackAll: false, repeats: 0 };
    let scope = opts.scope || "taught";
    // 指定單一主題時以主題為準（主題已隱含科目），否則按科目篩
    let pool = (scope !== "taught" && scope !== "all") ? bank.filter(i => i.topic === scope)
      : bank.filter(i => opts.subject === "混合" || i.subject === opts.subject);
    if (scope === "taught" && (!opts.taughtSet || opts.taughtSet.size === 0)) { scope = "all"; notes.fallbackAll = true; }
    const isTaught = i => scope === "taught" && opts.taughtSet.has(i.topic);

    const levelBudget = { "知道": Math.round(n * 0.2), "應用": Math.round(n * 0.5) };
    levelBudget["推理"] = n - levelBudget["知道"] - levelBudget["應用"];
    const typeCount = { mcq: 0, numpad: 0, order: 0, multi: 0 };
    const chosen = [], chosenIds = new Set();
    const age = i => opts.recent.has(i.id) ? T.daysBetween(opts.recent.get(i.id), opts.today) : Infinity;

    // 從 list 取最多 count 題，只取「距上次出題超過 days 天」的；回傳實際取到的數目
    function take(list, count, days) {
      let got = 0;
      while (got < count) {
        const cands = list.filter(i => !chosenIds.has(i.id) && (days < 0 || age(i) > days));
        if (!cands.length) break;
        // 先選剩餘預算最多的層次；同層次內選目前最少的題型
        const levels = Object.keys(levelBudget).filter(l => levelBudget[l] > 0 && cands.some(c => c.level === l))
          .sort((a, b) => levelBudget[b] - levelBudget[a]);
        const byLevel = levels.length ? cands.filter(c => c.level === levels[0]) : cands;
        const minType = Math.min(...byLevel.map(c => typeCount[c.type]));
        const best = byLevel.filter(c => typeCount[c.type] === minType);
        const it = best[Math.floor(rng() * best.length)];
        const q = Object.assign({}, it, { repeat: age(it) <= 7 });
        if (q.repeat) notes.repeats++;
        chosen.push(q); chosenIds.add(it.id); typeCount[it.type]++;
        if (levelBudget[it.level] > 0) levelBudget[it.level]--;
        got++;
      }
      return got;
    }

    // 每一層新鮮度內做七三分：已教配額 → 全範圍配額 → 同層剩餘任取；不夠才放寬到下一層，最後一層不看日期
    const tTarget = scope === "taught" ? Math.round(n * 0.7) : 0;
    const inT = pool.filter(isTaught), outT = pool.filter(i => !isTaught(i));
    const tGot = () => chosen.filter(isTaught).length;
    for (const days of [14, 7, -1]) {
      let need = n - chosen.length;
      if (need <= 0) break;
      need -= take(inT, Math.min(need, Math.max(0, tTarget - tGot())), days);
      need -= take(outT, Math.min(need, Math.max(0, (n - tTarget) - (chosen.length - tGot()))), days);
      take(pool, need, days);
    }

    // 推理題放後半：非推理先、推理後，各自打亂，再分散題型
    const nonR = T.shuffle(chosen.filter(q => q.level !== "推理"), rng), R = T.shuffle(chosen.filter(q => q.level === "推理"), rng);
    return { items: T.spreadTypes(nonR.concat(R)), notes };
  };

  // ---------- 紀錄 ----------
  T.RECORD_COLS = ["date", "session_id", "item_id", "subject", "topic", "level", "type", "red_correct", "blue_correct", "red_ms", "blue_ms", "repeat"];
  T.records = function (storage) {
    const KEY = "tug.records";
    storage = storage || globalThis.localStorage;
    function load() { try { const v = JSON.parse(storage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }
    function save(rows) { storage.setItem(KEY, JSON.stringify(rows)); }
    return {
      load,
      append(rows) { save(load().concat(rows)); },
      clear() { storage.removeItem(KEY); },
      recentMap() { const m = new Map(); for (const r of load()) if (!m.has(r.item_id) || r.date > m.get(r.item_id)) m.set(r.item_id, r.date); return m; },
      toCSV(rows) {
        const esc = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
        return "\uFEFF" + [T.RECORD_COLS.join(",")].concat(rows.map(r => T.RECORD_COLS.map(c => esc(r[c])).join(","))).join("\n");
      },
    };
  };

  // ======================================================== DOM \u6D41\u7A0B\uFF08\u53EA\u5728\u700F\u89BD\u5668\u57F7\u884C\uFF09
  if (typeof document === "undefined") return;
  const $ = id => document.getElementById(id);
  const bank = typeof TUG_BANK !== "undefined" ? TUG_BANK : [], taughtTable = typeof TUG_TAUGHT !== "undefined" ? TUG_TAUGHT : {}, topicText = typeof TUG_TOPICS !== "undefined" ? TUG_TOPICS : {};
  const R = T.records();
  const STEP = 60;   // 每拉一格，繩子、繩結與兩隊一起移動 60 個 viewBox 單位
  const S = { names: ["\u7D05\u968A", "\u85CD\u968A"], winAt: 5, pos: 0, items: [], qi: 0, q: null, ctrl: [null, null], resp: [null, null], ms: [null, null],
              qStart: 0, timer: null, tleft: 0, limitScale: 1, stats: [[0, 0], [0, 0]], bothWrong: [], session: "", rows: [] };

  function taughtSet(today) {
    const s = new Set();
    for (const d in taughtTable) if (d < today) taughtTable[d].forEach(t => s.add(t));
    return s;
  }
  function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); }
  function on(id, ev, fn) { $(id).addEventListener(ev, fn); }

  // ---------- \u958B\u59CB\u756B\u9762 ----------
  $("bankinfo").textContent = `\u984C\u5EAB ${bank.length} \u984C\uFF08\u6578\u5B78 ${bank.filter(i => i.subject === "\u6578\u5B78").length}\u3001\u79D1\u5B78 ${bank.filter(i => i.subject === "\u79D1\u5B78").length}\uFF09`;
  {
    const today = T.todayStr(), ts = taughtSet(today);
    $("startNote").textContent = ts.size ? `\u5DF2\u6559\u4E3B\u984C ${ts.size} \u500B\uFF08\u4F9D\u79D1\u666E\u6F5B\u80FD\u73ED\u9032\u5EA6\uFF0C${today}\uFF09` : "\u5B78\u671F\u5C1A\u672A\u958B\u59CB\uFF0C\u300C\u8DDF\u9032\u5EA6\u300D\u6703\u81EA\u52D5\u6539\u70BA\u5168\u7BC4\u570D";
  }
  {
    // 「指定單一主題」：只列目前科目有的主題；選了某主題則科目自動跟隨
    const sel = $("scope"), subj = $("subject"), topicSubject = {};
    bank.forEach(i => { topicSubject[i.topic] = i.subject; });
    function fillScope() {
      const keep = sel.value;
      [...sel.querySelectorAll("option[data-topic]")].forEach(o => o.remove());
      [...new Set(bank.filter(i => subj.value === "混合" || i.subject === subj.value).map(i => i.topic))].sort().forEach(t => {
        const o = document.createElement("option"); o.value = t; o.dataset.topic = "1";
        o.textContent = `只出 ${t} ${topicText[t] || ""}`.trim(); sel.appendChild(o);
      });
      sel.value = [...sel.options].some(o => o.value === keep) ? keep : "taught";
    }
    fillScope();
    subj.addEventListener("change", fillScope);
    sel.addEventListener("change", () => { const ts = topicSubject[sel.value]; if (ts && subj.value !== ts) { const t = sel.value; subj.value = ts; fillScope(); sel.value = t; } });
  }
  // 音效：作答區任何按鍵按下都有輕微回饋；靜音鍵
  document.querySelector(".sides").addEventListener("pointerdown", e => { if (e.target.closest("button")) T.audio.play("tap"); }, true);
  const muteBtn = $("muteBtn");
  const drawMute = () => { muteBtn.textContent = T.audio.isMuted() ? "🔇 靜音" : "🔊 聲音"; };
  drawMute(); muteBtn.addEventListener("click", () => { T.audio.setMuted(!T.audio.isMuted()); drawMute(); });
  on("startBtn", "click", startGame);
  on("exportBtn", "click", () => {
    const rows = R.load(); if (!rows.length) { alert("\u9084\u6C92\u6709\u7D00\u9304\u3002"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([R.toCSV(rows)], { type: "text/csv;charset=utf-8" }));
    a.download = `\u6436\u7B54\u62D4\u6CB3\u7D00\u9304_${T.todayStr()}.csv`; a.click();
  });
  on("clearBtn", "click", () => { if (confirm("\u78BA\u5B9A\u6E05\u9664\u5168\u90E8\u4F5C\u7B54\u7D00\u9304\uFF1F\u5EFA\u8B70\u5148\u532F\u51FA\u3002") && confirm("\u771F\u7684\u8981\u6E05\u9664\u55CE\uFF1F\u6B64\u52D5\u4F5C\u4E0D\u80FD\u5FA9\u539F\u3002")) { R.clear(); alert("\u5DF2\u6E05\u9664\u3002"); } });
  on("againBtn", "click", () => location.reload());
  on("fsBtn", "click", toggleFS);
  on("nextBtn", "click", nextQuestion);
  function toggleFS() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

  function startGame() {
    S.names = [$("nameL").value.trim() || "\u7D05\u968A", $("nameR").value.trim() || "\u85CD\u968A"];
    S.winAt = +$("winAt").value; S.limitScale = +$("tlimit").value;
    const today = T.todayStr();
    const r = T.pick(bank, { n: +$("nq").value, subject: $("subject").value, scope: $("scope").value,
      taughtSet: taughtSet(today), recent: R.recentMap(), today });
    if (!r.items.length) { alert("\u9019\u500B\u7BC4\u570D\u6C92\u6709\u984C\u76EE\u3002"); return; }
    S.items = r.items; S.qi = 0; S.pos = 0; S.stats = [[0, 0], [0, 0]]; S.bothWrong = []; S.rows = [];
    S.session = today.replace(/-/g, "") + "-" + new Date().toTimeString().slice(0, 5).replace(":", "");
    $("scoreL").textContent = S.names[0]; $("scoreR").textContent = S.names[1];
    $("head0").textContent = S.names[0] + " \u9019\u908A\u7B54"; $("head1").textContent = "\u9019\u908A\u7B54 " + S.names[1];
    const gx = 800 - S.winAt * STEP, gr = 800 + S.winAt * STEP;
    ["goalL"].forEach(id => { $(id).setAttribute("x1", gx); $(id).setAttribute("x2", gx); });
    ["goalR"].forEach(id => { $(id).setAttribute("x1", gr); $(id).setAttribute("x2", gr); });
    drawTeam("teamL", 0); drawTeam("teamR", 1);
    if (r.notes.fallbackAll) callout("\u5168\u7BC4\u570D", null);
    T.audio.unlock(); T.audio.play("start"); T.audio.startBgm();
    show("game"); updateRope(); nextQuestion();
  }

  // ---------- \u4E00\u984C ----------
  function nextQuestion() {
    if (S.qi >= S.items.length) { finish(); return; }
    const q = S.q = T.prepareView(S.items[S.qi], Math.random);
    const mod = T.types[q.type];
    $("qno").textContent = `\u7B2C ${S.qi + 1}\uFF0F${S.items.length} \u984C`;
    $("domTag").textContent = `${q.subject} \u00B7 ${q.topic} \u00B7 ${q.level}`;
    $("pullTag").textContent = `\u7B54\u5C0D\u62C9 ${T.PULL[q.level]} \u683C`;
    $("typeTag").textContent = { mcq: "\u56DB\u9078\u4E00", numpad: "\u8F38\u5165\u6578\u5B57", order: "\u6392\u9806\u5E8F", multi: "\u9078\u51FA\u6240\u6709\u6B63\u78BA\u7684" }[q.type];
    $("qtext").textContent = q.stem;
    $("why").className = "why"; $("why").textContent = ""; $("nextBtn").className = "next";
    S.resp = [null, null]; S.ms = [null, null]; S.qStart = Date.now();
    delete $("game").dataset.result;
    T.audio.duck(false);          // 動畫鉤子：每題開始時清除上一題結果
    [0, 1].forEach(side => {
      $("side" + side).classList.remove("done", "locked");
      S.ctrl[side] = mod.render(q, side, $("body" + side), resp => submit(side, resp));
    });
    startTimer(Math.round(mod.limit * S.limitScale));
  }
  function submit(side, resp) {
    if (S.resp[side] !== null) return;
    S.resp[side] = resp; S.ms[side] = Date.now() - S.qStart;
    $("side" + side).classList.add("done"); T.audio.play("submit");
    if (S.resp[0] !== null && S.resp[1] !== null) judge();
  }
  function judge() {
    stopTimer();
    const q = S.q, mod = T.types[q.type];
    [0, 1].forEach(side => { S.ctrl[side].lock(); $("side" + side).classList.add("locked"); });
    const ok = [0, 1].map(side => S.resp[side] !== null && mod.judge(q, S.resp[side]));
    const ms = [0, 1].map(side => S.resp[side] !== null ? S.ms[side] : null);
    const r = T.resolve({ pull: T.PULL[q.level], ok, ms });
    [0, 1].forEach(side => { S.stats[side][ok[side] ? 0 : 1]++; S.ctrl[side].reveal(ok[side]); });
    if (!ok[0] && !ok[1]) S.bothWrong.push(q);
    S.pos += r.delta;
    const timedOut = S.resp.some(x => x === null);
    $("game").dataset.result = r.who === null ? (timedOut ? "timeout" : "none") : String(r.who);   // 動畫鉤子：0 紅拉贏、1 藍拉贏、none 都錯、timeout 時間到
    callout(timedOut && !ok[0] && !ok[1] ? "\u6642\u9593\u5230\uFF01" : r.msg, r.who);
    T.audio.duck(true);
    if (r.who !== null) { T.audio.play("pull"); setTimeout(() => T.audio.play("correct"), 250); }
    else if (ok[0] && ok[1]) T.audio.play("correct");
    else T.audio.play(timedOut ? "timeout" : "wrong");
    $("why").textContent = ((ok[0] && ok[1]) ? "\u2713 " : "\u6B63\u78BA\u7B54\u6848\uFF1A" + answerText(q) + "\u3000") + q.explain; $("why").classList.add("show");
    S.rows.push({ date: T.todayStr(), session_id: S.session, item_id: q.id, subject: q.subject, topic: q.topic, level: q.level, type: q.type,
      red_correct: ok[0] ? 1 : 0, blue_correct: ok[1] ? 1 : 0, red_ms: ms[0] ?? "", blue_ms: ms[1] ?? "", repeat: q.repeat ? 1 : 0 });
    R.append([S.rows[S.rows.length - 1]]);
    updateRope();
    S.qi++;
    if (Math.abs(S.pos) >= S.winAt) { setTimeout(finish, 1400); return; }
    $("nextBtn").classList.add("show");
  }
  function answerText(q) {
    if (q.type === "mcq") return q.options[q.answer];
    if (q.type === "numpad") return q.answer + (q.unit || "");
    if (q.type === "order") return q.answer.map(i => q.options[i]).join(" \u2192 ");
    return q.answer.map(i => q.options[i]).join("\u3001");
  }

  // ---------- \u8A08\u6642 ----------
  function startTimer(limit) {
    stopTimer(); const box = $("timerBox"), bar = $("timerBar");
    if (!limit) { box.style.visibility = "hidden"; return; }
    box.style.visibility = "visible"; S.tleft = limit;
    bar.className = ""; bar.style.transition = "none"; bar.style.width = "100%";
    requestAnimationFrame(() => { bar.style.transition = "width 1s linear"; });
    S.timer = setInterval(() => {
      S.tleft--; bar.style.width = (S.tleft / limit * 100) + "%";
      if (S.tleft <= 5) { bar.className = "low"; if (S.tleft > 0) T.audio.play("tick"); }
      if (S.tleft <= 0) { stopTimer(); judge(); }
    }, 1000);
  }
  function stopTimer() { clearInterval(S.timer); S.timer = null; }

  // ---------- \u5834\u666F ----------
  function updateRope() {
    // 繩結固定在繩子的 800 處；整條繩（含繩結）與兩隊一起平移，像真的拔河一樣
    const dx = S.pos * STEP, ease = "transform .7s cubic-bezier(.2,1.3,.4,1)";
    $("knot").style.transform = "translate(800px,0)";
    $("knotTxt").textContent = S.pos === 0 ? "0" : (S.pos < 0 ? "\u25C0 " + (-S.pos) : S.pos + " \u25B6");
    ["ropeG", "teamL", "teamR"].forEach(id => { $(id).style.transition = ease; $(id).style.transform = `translate(${dx}px,0)`; });
  }
  // 畫一隊四個卡通小學生：面向中線、身體向後傾、雙手握繩、前腳蹬後腳撐。座標以腳底 (x, 292) 為原點，繩在 y=205（局部約 -95，經 0.8–0.9 縮放後仍對到繩）。
  function drawTeam(gid, side) {
    const col = side ? "#2457E6" : "#E8413C", dark = side ? "#183FA8" : "#B72E2A";
    const skins = side ? ["#BB8058", "#F1C7A0", "#DFAB7E", "#F7D6B2"] : ["#F1C7A0", "#C38A61", "#F7D6B2", "#DFAB7E"];
    const hairs = ["#33312B", "#604131", "#33312B", "#835035"];
    let art = "";
    for (let i = 0; i < 4; i++) {
      const x = side ? 1050 + i * 112 : 550 - i * 112, skin = skins[i], hair = hairs[i];
      const style = (i + side * 2) % 4;
      const hairArt = [
        `<path d="M-39-145q-9-45 31-45 31-4 37 26l-17-6-8 13-15-8-14 18Z" fill="${hair}"/>`,
        `<path d="M-36-154q-8-33 25-38 33-3 42 28l-20-4-13 11-16-9Z" fill="${hair}"/><path d="M-37-170q-34-11-32 17 1 25-19 28 39 12 43-25" fill="${hair}"/><path d="M-44-167l11 9" stroke="${col}" stroke-width="9"/>`,
        `<path d="M-40-151l-4-25 13 1 5-20 13 9 16-13 8 15 17-4 4 25-21-7-11 12-14-7Z" fill="${hair}"/>`,
        `<path d="M-38-148q-17-42 22-45 47-4 48 41l-20-13-16 8-16-7-5 18Z" fill="${hair}"/>`
      ][style];
      art += `<g class="kid kid-${i}" transform="translate(${x},292) scale(${side ? -1 : 1},1)">
        <ellipse cx="-8" cy="2" rx="49" ry="7" fill="#24332E" opacity=".18"/>
        <g class="dust" fill="#FFFCEF"><ellipse cx="-48" cy="-4" rx="15" ry="8"/><circle cx="-63" cy="-13" r="7"/><circle cx="39" cy="-7" r="8"/></g>
        <g class="kid-motion" stroke="#24332E" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M-19-59L-36-33-50-10M7-59L29-39 21-10" fill="none" stroke="#24332E" stroke-width="19"/>
          <path d="M-19-59L-36-33-50-10M7-59L29-39 21-10" fill="none" stroke="${skin}" stroke-width="11"/>
          <path d="M-44-20l-6 10m73-10-2 10" stroke="#FFFCEF" stroke-width="13"/>
          <path d="M-57-13q-9 3-8 13h33q6-8-11-13Z M17-13q-8 3-8 13h35q2-10-16-13Z" fill="#FFFCEF"/>
          <path d="M-62-3h26M13-3h27" stroke="${col}" stroke-width="5"/>
          <path d="M-31-80h54l-2 28H1l-5-10-5 10h-24Z" fill="${dark}"/>
          <path d="M-34-132q22-10 43 4l17 51q-31 10-58-1Z" fill="${col}"/>
          <path d="M-30-111l10 29 43-4 3 9q-29 10-58-1Z" fill="${dark}" stroke="none"/>
          <path d="M-25-133q10 16 24 4" fill="#FFFCEF"/>
          <text x="-7" y="-95" text-anchor="middle" fill="#FFFCEF" stroke="none" font-size="23" font-weight="900" transform="${side ? 'translate(-14,0) scale(-1,1)' : ''}">${i + 1 + side * 4}</text>
          <path d="M-21-116L3-96 40-87M9-115L28-99 57-87" fill="none" stroke="#24332E" stroke-width="17"/>
          <path d="M-21-116L3-96 40-87M9-115L28-99 57-87" fill="none" stroke="${skin}" stroke-width="10"/>
          <path d="M-26-121l11 11m20-11 9 10" stroke="${col}" stroke-width="18"/>
          <ellipse cx="-5" cy="-152" rx="34" ry="31" fill="${skin}"/>
          <path d="M18-172q18 16 4 34" fill="none" stroke="#A96F4F" stroke-width="5" opacity=".4"/>
          <circle cx="-33" cy="-148" r="8" fill="${skin}"/>
          ${hairArt}
          ${i === 3 ? `<path d="M-39-174q20-21 52-4l7 10h-58Z" fill="${col}"/><path d="M5-171h37q4 8-9 9H6Z" fill="${dark}"/>` : `<path d="M-34-174q26-7 54 3" stroke="#FFFCEF" stroke-width="7"/>`}
          <path d="M-5-154l8 3m12-2 7-5" fill="none"/>
          <path d="M1-146v2m17-3v2" stroke-width="5"/>
          ${i === 1 ? '<g fill="none" stroke-width="3"><rect x="-9" y="-151" width="16" height="14" rx="5"/><rect x="12" y="-154" width="15" height="14" rx="5"/><path d="M7-146h5m-21 2-19-5"/></g>' : ''}
          <path d="M5-131q8-7 16-2l-2 8Z" fill="#FFFCEF" stroke-width="3"/>
          <ellipse cx="-10" cy="-135" rx="7" ry="4" fill="#E48D78" stroke="none"/>
          <path d="M35-88q-4-13 5-14 8 0 9 14M51-88q-3-13 5-14 9 0 10 14" fill="${skin}"/>
          <path d="M39-97v7m5-6v6m12-7v7m5-6v6" stroke="#A96F4F" stroke-width="2"/>
        </g>
      </g>`;
    }
    $(gid).innerHTML = art;
  }
  function callout(txt, side) {
    const c = $("callout"); c.textContent = txt;
    c.style.color = side === null ? "#1F2233" : (side ? "#2457E6" : "#E8413C");
    c.classList.add("show"); setTimeout(() => c.classList.remove("show"), 1100);
  }

  // ---------- \u7D50\u675F ----------
  function finish() {
    const w = S.pos < 0 ? 0 : S.pos > 0 ? 1 : null;
    stopTimer(); T.audio.stopBgm(); T.audio.play(w === null ? "both" : "win");
    $("win").className = "screen on " + (w === null ? "draw" : w ? "blue" : "red");
    document.querySelectorAll(".screen").forEach(s => { if (s.id !== "win") s.classList.remove("on"); });
    $("winName").textContent = w === null ? "\u5E73\u624B\uFF01" : S.names[w] + " \u52DD\u5229\uFF01";
    $("winLine").textContent = Math.abs(S.pos) >= S.winAt ? "\u628A\u7E69\u5B50\u62C9\u904E\u7DDA\u4E86\uFF01" : `${S.items.length} \u984C\u7B54\u5B8C\uFF0C\u7E69\u7D50\u504F\u5411 ${w === null ? "\u4E2D\u9593" : S.names[w]}`;
    $("winStats").textContent = `${S.names[0]} \u7B54\u5C0D ${S.stats[0][0]} \u984C\u3001\u7B54\u932F ${S.stats[0][1]} \u984C\u3000\uFF5C\u3000${S.names[1]} \u7B54\u5C0D ${S.stats[1][0]} \u984C\u3001\u7B54\u932F ${S.stats[1][1]} \u984C`;
    $("winMiss").textContent = S.bothWrong.length
      ? "\u5169\u968A\u90FD\u7B54\u932F\uFF1A" + [...new Set(S.bothWrong.map(q => `${q.topic}\uFF08${q.level}\uFF09`))].join("\u3001") + " \u2014\u2014 \u503C\u5F97\u56DE\u8AB2\u5802\u88DC\u4E00\u88DC"
      : "\u6C92\u6709\u5169\u968A\u90FD\u7B54\u932F\u7684\u984C\u76EE\u3002";
  }

  // ---------- \u9375\u76E4\uFF08\u8001\u5E2B\u7528\uFF09 ----------
  document.addEventListener("keydown", e => {
    if (!$("game").classList.contains("on")) return;
    if ((e.key === " " || e.key === "Enter") && $("nextBtn").classList.contains("show")) { e.preventDefault(); nextQuestion(); return; }
    if (e.key.toLowerCase() === "f") { toggleFS(); return; }
    if (!S.q || !S.ctrl[0]) return;
    const kL = "1234".indexOf(e.key), kR = "zxcv".indexOf(e.key.toLowerCase());
    if (kL > -1) S.ctrl[0].press(kL);
    if (kR > -1) S.ctrl[1].press(kR);
  });
})();

</script>
